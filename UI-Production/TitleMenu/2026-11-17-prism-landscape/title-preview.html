<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아스텔라 · 풍경 중심 메인 화면 시안</title>
  <style>
    @font-face {
      font-family: MaruBuri;
      src: url('../../../Assets/UI/AstellaPrismV4/Typography/Fonts/MaruBuri-SemiBold.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: Pretendard;
      src: url('../../../Assets/UI/AstellaPrismV4/Typography/Fonts/Pretendard-Medium.ttf') format('truetype');
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #161722; color: #edf0f5; font: 14px/1.6 Pretendard, sans-serif; }
    .preview-bar, .preview-note { max-width: 1536px; margin: 0 auto; padding: 18px 24px; }
    .preview-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 30px; }
    .preview-bar h1 { margin: 0 0 3px; font-size: 17px; font-weight: 500; }
    .preview-bar p, .preview-note p { margin: 0; color: #b7becd; }
    .preview-bar label { display: flex; align-items: center; gap: 9px; cursor: pointer; white-space: nowrap; }
    .preview-bar input { accent-color: #c6a4fa; width: 16px; height: 16px; }
    .stage-wrap { max-width: 1920px; margin: 0 auto; }
    .scene {
      position: relative; isolation: isolate; width: 100%; aspect-ratio: 16 / 9;
      overflow: hidden; background: #1c203b; container-type: inline-size;
    }
    .landscape { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .scene::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      background: linear-gradient(90deg, rgba(8, 10, 25, .24), rgba(8, 10, 25, .07) 29%, transparent 47%);
    }
    .brand { position: absolute; left: 10.5%; top: 11%; color: #f7f4ff; }
    .brand-word {
      margin: 0; font: normal 3.958333cqw/1.14 MaruBuri, serif; letter-spacing: .14em;
      text-shadow: 0 2px 8px #141126, 0 0 25px rgba(202, 180, 255, .16);
      -webkit-text-stroke: .4px rgba(24, 17, 44, .65); paint-order: stroke fill;
    }
    .brand-ko { margin: 14px 0 0 4px; font: normal 1.04cqw/1.6 MaruBuri, serif; letter-spacing: .34em; color: #d6cbe9; text-shadow: 0 2px 4px #101020; }
    .main-menu { position: absolute; left: 11%; top: 36%; width: 24%; display: flex; flex-direction: column; align-items: flex-start; gap: .42cqw; }
    .entry { width: 100%; }
    .menu-action {
      position: relative; display: block; width: 100%; min-height: 2.82cqw; padding: .36cqw 0;
      border: 0; border-radius: 0; background: transparent; text-align: left; color: #f0ebf8;
      cursor: pointer; font: normal 1.458333cqw/1.55 MaruBuri, serif;
      text-shadow: 0 1px 3px rgba(6, 6, 17, .94), 0 0 12px rgba(6, 6, 17, .48);
      -webkit-text-stroke: .4px rgba(12, 10, 25, .75); paint-order: stroke fill;
    }
    .menu-action .label { display: inline-block; transition: transform .16s ease, color .16s ease; }
    .menu-action::before {
      content: '◆'; position: absolute; left: -1.4cqw; top: .99cqw;
      color: #c6a4fa; font: normal .43cqw/1 Pretendard, sans-serif; opacity: 0;
      text-shadow: 0 0 8px rgba(185, 143, 255, .65); transition: opacity .16s ease;
    }
    .menu-action:hover:not(:disabled) .label, .menu-action:focus-visible .label { color: #e1ccff; transform: translateX(.24cqw); }
    .menu-action.is-selected .label, .menu-action:focus-visible .label { text-decoration: underline; text-decoration-color: rgba(196, 162, 249, .68); text-underline-offset: .45cqw; text-decoration-thickness: 1px; }
    .menu-action:hover:not(:disabled)::before, .menu-action:focus-visible::before, .menu-action.is-selected::before { opacity: 1; }
    .menu-action:focus { outline: none; }
    .menu-action:disabled { color: #9ca0b5; opacity: .58; cursor: default; }
    .save-hint { margin: -.02cqw 0 .43cqw; color: #bbc0d2; font-size: .70cqw; line-height: 1.5; text-shadow: 0 1px 3px #0c0c1b; }
    .preview-note { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 30px; }
    #preview-status { color: #ddd2f5; }
    .capture .preview-bar, .capture .preview-note { display: none; }
    .capture .stage-wrap { max-width: none; margin: 0; }
    .capture .scene { width: 100vw; height: 100vh; aspect-ratio: auto; }
    @media (max-width: 700px) {
      .preview-bar, .preview-note { padding: 13px 16px; font-size: 12px; }
      .preview-bar h1 { font-size: 15px; }
      .preview-note { display: block; }
    }
    @media (prefers-reduced-motion: reduce) { .menu-action .label, .menu-action::before { transition: none; } }
  </style>
</head>
<body>
  <header class="preview-bar">
    <div>
      <h1>아스텔라 · 메인 화면 시안</h1>
      <p>실제 게임과 연결되지 않음 · 메뉴는 선택 표시만 확인할 수 있습니다.</p>
    </div>
    <label><input id="saved-example" type="checkbox"> 예시 저장 있음</label>
  </header>

  <main class="stage-wrap">
    <section class="scene" aria-label="수정 공명 풍경 위에 로고와 텍스트 메뉴를 배치한 아스텔라 메인 화면">
      <img class="landscape" src="title-environment.png" alt="구름과 산맥 위의 은빛 유적, 보랏빛 수정이 빛나는 공명 성소">
      <div class="brand" aria-label="ASTELLA 아스텔라">
        <p class="brand-word">ASTELLA</p>
        <p class="brand-ko">아스텔라</p>
      </div>
      <nav class="main-menu" aria-label="메인 메뉴">
        <div class="entry">
          <button class="menu-action" id="continue" data-action="이어하기" disabled aria-pressed="false"><span class="label">이어하기</span></button>
          <p class="save-hint" id="save-hint">저장된 원정이 없습니다</p>
        </div>
        <button class="menu-action is-selected" data-action="새 원정 시작" aria-pressed="true"><span class="label">새 원정 시작</span></button>
        <button class="menu-action" data-action="파티 참가" aria-pressed="false"><span class="label">파티 참가</span></button>
        <button class="menu-action" data-action="저장 관리" aria-pressed="false"><span class="label">저장 관리</span></button>
        <button class="menu-action" data-action="설정" aria-pressed="false"><span class="label">설정</span></button>
        <button class="menu-action" data-action="종료" aria-pressed="false"><span class="label">종료</span></button>
      </nav>
    </section>
  </main>

  <footer class="preview-note">
    <p>풍경 중심 구성 · 기존 기능 6개를 텍스트 메뉴로 배치</p>
    <p id="preview-status" role="status" aria-live="polite">선택한 메뉴: 새 원정 시작 (표시 확인용)</p>
  </footer>

  <script>
    'use strict';
    const query = new URLSearchParams(window.location.search);
    if (query.get('capture') === '1') document.body.classList.add('capture');
    const actions = [...document.querySelectorAll('.menu-action')];
    const savedToggle = document.getElementById('saved-example');
    const continueButton = document.getElementById('continue');
    const status = document.getElementById('preview-status');
    function selectAction(button) {
      if (button.disabled) return;
      for (const action of actions) {
        const selected = action === button;
        action.classList.toggle('is-selected', selected);
        action.setAttribute('aria-pressed', String(selected));
      }
      status.textContent = `선택한 메뉴: ${button.dataset.action} (표시 확인용)`;
    }
    for (const action of actions) {
      action.addEventListener('click', () => selectAction(action));
      action.addEventListener('keydown', event => {
        if (!['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const enabled = actions.filter(button => !button.disabled);
        const current = enabled.indexOf(action);
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? enabled.length - 1 :
          (current + (event.key === 'ArrowDown' ? 1 : -1) + enabled.length) % enabled.length;
        enabled[next].focus();
      });
    }
    function updateExample() {
      continueButton.disabled = !savedToggle.checked;
      document.getElementById('save-hint').textContent = savedToggle.checked ? '예시 저장: 1부 · Stage 2 / 6' : '저장된 원정이 없습니다';
      if (continueButton.disabled && continueButton.classList.contains('is-selected')) selectAction(actions[1]);
    }
    savedToggle.addEventListener('change', updateExample);
    savedToggle.checked = query.get('saved') === '1';
    updateExample();
    document.fonts.ready.then(() => { document.body.dataset.ready = 'true'; });
  </script>
</body>
</html>
