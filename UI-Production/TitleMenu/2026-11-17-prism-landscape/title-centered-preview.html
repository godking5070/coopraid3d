<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아스텔라 · 중앙 로고와 하단 메뉴 시안</title>
  <style>
    @font-face { font-family: MaruBuri; src: url('../../../Assets/UI/AstellaPrismV4/Typography/Fonts/MaruBuri-SemiBold.ttf') format('truetype'); font-display: swap; }
    @font-face { font-family: Pretendard; src: url('../../../Assets/UI/AstellaPrismV4/Typography/Fonts/Pretendard-Medium.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #161722; color: #edf0f5; font: 14px/1.6 Pretendard, sans-serif; }
    .preview-bar, .preview-note { max-width: 1536px; margin: auto; padding: 18px 24px; }
    .preview-bar, .preview-note, .review-controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 28px; }
    .preview-bar h1 { margin: 0 0 3px; font-size: 17px; font-weight: 500; }
    .preview-bar p, .preview-note p { margin: 0; color: #b7becd; }
    .review-controls a { color: #d2bcf1; text-underline-offset: 4px; }
    .review-controls label { display: flex; gap: 9px; align-items: center; white-space: nowrap; cursor: pointer; }
    .review-controls input { width: 16px; height: 16px; accent-color: #c6a4fa; }
    .stage-wrap { max-width: 1920px; margin: auto; }
    .scene { position: relative; isolation: isolate; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #1c203b; container-type: inline-size; }
    .landscape { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .scene::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      background: radial-gradient(ellipse 40% 19% at 50% 50%, rgba(12, 13, 34, .22), transparent 90%),
        linear-gradient(0deg, rgba(8, 10, 26, .57), rgba(8, 10, 26, .24) 23%, transparent 52%);
    }
    .brand { position: absolute; left: 50%; top: 42%; width: 70%; transform: translateX(-50%); text-align: center; color: #f7f4ff; }
    .brand-word {
      margin: 0; font: normal 6.45833cqw/1.14 MaruBuri, serif; letter-spacing: .16em; text-indent: .16em;
      text-shadow: 0 2px 6px #131022, 0 0 23px rgba(16, 12, 37, .56), 0 0 50px rgba(207, 191, 244, .18);
      -webkit-text-stroke: .8px rgba(19, 16, 34, .78); paint-order: stroke fill;
    }
    .brand-ko { margin: .52cqw 0 0; font: normal 1.14583cqw/1.6 MaruBuri, serif; letter-spacing: .44em; text-indent: .44em; color: #e0d7ed; text-shadow: 0 1px 4px #131022; }
    .menu-row { position: absolute; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 15cqw); column-gap: 3.8cqw; align-items: start; text-align: center; }
    .primary-menu { top: 72%; }
    .secondary-menu { top: 83%; }
    .menu-action {
      position: relative; display: block; width: 100%; min-height: 3.5cqw; padding: .46cqw .2cqw;
      border: 0; border-radius: 0; background: transparent; cursor: pointer; color: #f3edf8;
      font: normal 1.8cqw/1.5 MaruBuri, serif; text-align: center;
      text-shadow: 0 1px 4px #131022, 0 0 10px rgba(8, 6, 21, .9);
      -webkit-text-stroke: .5px rgba(19, 16, 34, .9); paint-order: stroke fill;
    }
    .secondary-menu .menu-action { min-height: 2.65cqw; font-size: 1.2cqw; color: #dbd5e4; }
    .menu-action .label { display: inline-block; transition: color .16s ease, transform .16s ease; }
    .menu-action::after { content: ''; position: absolute; left: 44%; bottom: .18cqw; width: 12%; height: 1px; background: #c6a4fa; opacity: 0; box-shadow: 0 0 9px rgba(196, 160, 249, .7); transition: opacity .16s ease; }
    .menu-action:hover:not(:disabled) .label, .menu-action:focus-visible .label { color: #eadbff; transform: translateY(-.1cqw); }
    .menu-action.is-selected::after, .menu-action:hover:not(:disabled)::after, .menu-action:focus-visible::after { opacity: 1; }
    .menu-action:focus { outline: none; }
    .menu-action:focus-visible .label { text-decoration: underline; text-decoration-color: #c6a4fa; text-underline-offset: .34cqw; text-decoration-thickness: 1px; }
    .menu-action:disabled { color: #b0adbd; opacity: .56; cursor: default; }
    .save-hint { min-height: 1.2cqw; margin: .16cqw 0 0; color: #bdb6ca; font-size: .7cqw; line-height: 1.5; white-space: nowrap; text-shadow: 0 1px 4px #131022; }
    #preview-status { color: #ddd2f5; }
    .capture .preview-bar, .capture .preview-note { display: none; }
    .capture .stage-wrap { max-width: none; margin: 0; }
    @media (max-width: 700px) { .preview-bar, .preview-note { padding: 13px 16px; font-size: 12px; } .preview-bar h1 { font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { .menu-action .label, .menu-action::after { transition: none; } }
  </style>
</head>
<body>
  <header class="preview-bar">
    <div><h1>아스텔라 · 중앙 로고 + 하단 텍스트 메뉴</h1><p>메인 화면 시안 · 실제 게임과 연결되지 않음</p></div>
    <div class="review-controls"><a href="title-preview.html">왼쪽 메뉴 시안과 비교</a><label><input id="saved-example" type="checkbox"> 예시 저장 있음</label></div>
  </header>
  <main class="stage-wrap">
    <section class="scene" aria-label="수정 성소 풍경 가운데 로고와 하단 가로 메뉴를 배치한 아스텔라 메인 화면">
      <img class="landscape" src="title-environment.png" alt="구름과 산맥 위의 은빛 유적, 보랏빛 수정이 빛나는 공명 성소">
      <div class="brand" aria-label="ASTELLA 아스텔라"><p class="brand-word">ASTELLA</p><p class="brand-ko">아스텔라</p></div>
      <nav class="menu-row primary-menu" aria-label="주 메뉴">
        <button class="menu-action is-selected" data-action="새 원정 시작" aria-pressed="true"><span class="label">새 원정 시작</span></button>
        <button class="menu-action" data-action="설정" aria-pressed="false"><span class="label">설정</span></button>
        <button class="menu-action" data-action="종료" aria-pressed="false"><span class="label">종료</span></button>
      </nav>
      <nav class="menu-row secondary-menu" aria-label="보조 메뉴">
        <div class="entry"><button class="menu-action" id="continue" data-action="이어하기" disabled aria-pressed="false"><span class="label">이어하기</span></button><p class="save-hint" id="save-hint">저장된 원정이 없습니다</p></div>
        <button class="menu-action" data-action="파티 참가" aria-pressed="false"><span class="label">파티 참가</span></button>
        <button class="menu-action" data-action="저장 관리" aria-pressed="false"><span class="label">저장 관리</span></button>
      </nav>
    </section>
  </main>
  <footer class="preview-note"><p>중앙 로고 · 하단 주 메뉴 3개와 보조 메뉴 3개</p><p id="preview-status" role="status" aria-live="polite">선택한 메뉴: 새 원정 시작 (표시 확인용)</p></footer>
  <script>
    'use strict';
    const query = new URLSearchParams(window.location.search);
    if (query.get('capture') === '1') document.body.classList.add('capture');
    const actions = [...document.querySelectorAll('.menu-action')];
    const savedToggle = document.getElementById('saved-example');
    const continueButton = document.getElementById('continue');
    const status = document.getElementById('preview-status');
    function selectAction(button) {
      if (button.disabled) return;
      for (const action of actions) { const selected = action === button; action.classList.toggle('is-selected', selected); action.setAttribute('aria-pressed', String(selected)); }
      status.textContent = `선택한 메뉴: ${button.dataset.action} (표시 확인용)`;
    }
    for (const action of actions) {
      action.addEventListener('click', () => selectAction(action));
      action.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const row = action.closest('.menu-row');
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          const rows = [...document.querySelectorAll('.menu-row')];
          const column = [...row.querySelectorAll('.menu-action')].indexOf(action);
          const step = event.key === 'ArrowDown' ? 1 : -1;
          const other = rows[(rows.indexOf(row) + step + rows.length) % rows.length];
          const target = [...other.querySelectorAll('.menu-action')].map((button, index) => ({ button, distance: Math.abs(index - column) }))
            .filter(item => !item.button.disabled).sort((a, b) => a.distance - b.distance)[0];
          if (target) target.button.focus();
          return;
        }
        const enabled = [...row.querySelectorAll('.menu-action')].filter(button => !button.disabled);
        const current = enabled.indexOf(action);
        const delta = event.key === 'ArrowRight' ? 1 : -1;
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? enabled.length - 1 : (current + delta + enabled.length) % enabled.length;
        enabled[next].focus();
      });
    }
    function updateExample() {
      continueButton.disabled = !savedToggle.checked;
      document.getElementById('save-hint').textContent = savedToggle.checked ? '예시 저장: 1부 · Stage 2 / 6' : '저장된 원정이 없습니다';
      if (continueButton.disabled && continueButton.classList.contains('is-selected')) selectAction(actions[0]);
    }
    savedToggle.addEventListener('change', updateExample); savedToggle.checked = query.get('saved') === '1'; updateExample();
    document.fonts.ready.then(() => {
      document.body.dataset.ready = 'true';
      document.body.dataset.fontsLoaded = String(document.fonts.check('16px MaruBuri') && document.fonts.check('16px Pretendard'));
    });
  </script>
</body>
</html>
