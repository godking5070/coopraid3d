<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Astella · 수호석상 전장</title>
  <style>
    html {
      color-scheme:dark;
      background:var(--background,#12151c);
      color:var(--foreground,#e8edf4);
      font-family:var(--font-sans,system-ui,sans-serif);
    }
    body { margin:0; }
    main { margin:0 auto; padding:15px clamp(10px,3vw,25px) 18px; max-width:1070px; }
    header { display:flex; align-items:baseline; gap:9px 15px; flex-wrap:wrap; margin-bottom:13px; }
    h1 { margin:0; font-size:clamp(22px,4vw,31px); letter-spacing:-.045em; }
    .hint { font-size:13px; color:var(--muted-foreground,#adb7c7); margin:0; }
    .viewport {
      position:relative;
      overflow:hidden;
      border:1px solid var(--border,#3c4657);
      border-radius:10px;
      background:#171e2b;
    }
    canvas { display:block; width:100%; height:auto; outline:none; }
    canvas:focus-visible { outline:2px solid #90abc5; outline-offset:-3px; }
    .cast {
      box-sizing:border-box;
      position:absolute;
      top:clamp(7px,2vw,17px);
      left:50%; transform:translateX(-50%);
      pointer-events:none;
      min-width:min(190px,46%);
      background:#141a23ea;
      border:1px solid #78879888;
      color:#f5f0e7;
      text-align:center;
      font-size:clamp(12px,2.2vw,16px);
      letter-spacing:.03em;
      padding:4px 10px;
      border-radius:6px;
      box-shadow:0 2px 10px #060a11b0;
    }
    .cast-line { height:3px; background:#323944; overflow:hidden; margin:4px -5px -1px; border-radius:2px; }
    .cast-fill { display:block; width:100%; height:100%; transform-origin:left; background:#dfba78; }
    .controls { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:11px; }
    button {
      padding:6px 10px;
      min-height:39px;
      background:var(--card,#202633);
      color:var(--card-foreground,#edf0f6);
      border:1px solid var(--border,#404b5d);
      border-radius:var(--radius,7px);
      font:inherit;
      font-size:13px;
      cursor:pointer;
    }
    button[aria-pressed="true"] {
      background:var(--accent,#e8d1a1);
      border-color:var(--accent,#e8d1a1);
      color:var(--accent-foreground,#1b1a20);
    }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible { outline:2px solid var(--ring,#92b3d3); outline-offset:2px; }
    .replay { margin-inline-start:auto; border-color:#9b805a; }
    #status { font-size:13px; margin:9px 0 0; min-height:1.4em; color:var(--muted-foreground,#adb7c7); }
    [hidden] { display:none !important; }
    @media(max-width:590px) { .replay { margin-inline-start:0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>수호석상 전장</h1>
      <p class="hint">바닥을 클릭하거나 탭하면 이리스가 이동합니다.</p>
    </header>
    <div class="viewport">
      <canvas id="arena" width="1672" height="941" tabindex="0" aria-label="이리스와 수호석상의 전장. 방향키로도 이리스를 움직일 수 있습니다."></canvas>
      <div id="cast" class="cast">
        <span id="cast-name">광장 내려찍기</span>
        <div class="cast-line" id="cast-line" hidden><span id="cast-fill" class="cast-fill"></span></div>
      </div>
    </div>
    <div class="controls" aria-label="레이드 패턴 미리보기" role="group">
      <button data-show="art" type="button" aria-pressed="false" disabled>전장</button>
      <button data-show="slam" type="button" aria-pressed="true" disabled>중앙 내려찍기</button>
      <button data-show="ring" type="button" aria-pressed="false" disabled>외곽 고리</button>
      <button data-show="stack" type="button" aria-pressed="false" disabled>집합</button>
      <button data-show="sequence" class="replay" type="button" aria-pressed="false" disabled>연계 패턴 재생</button>
    </div>
    <p id="status" role="status">리소스를 불러오는 중입니다.</p>
  </main>
  <script>
    (async () => {
      const options = {
        background: "StoneGuardianArena.png",
        guardian: "StoneGuardian.png",
        iris: "IrisRigPreview.png"
      };
      const get = id => document.getElementById(id);
      const board = get('arena');
      const ctx = board.getContext('2d',{alpha:false});
      const status = get('status');
      async function load(source) {
        const image = new Image();
        image.src = source;
        await image.decode();
        return image;
      }
      let background, guardian, iris;
      try {
        [background,guardian,iris] = await Promise.all(Object.values(options).map(load));
        if (iris.naturalWidth !== 1008 || iris.naturalHeight !== 448) throw new Error('Iris atlas grid');
      } catch {
        status.textContent = '전장 리소스를 불러올 수 없습니다.';
        return;
      }

      const plaza = { radius:18, x:836, y:452, horizontal:758, vertical:323, depth:.185 };
      const group = { x:-5.8, z:6.6 };
      const timing = { slam:4, ring:5.05, warning:.4, trace:.08 };
      const names = { art:'수호석상', slam:'광장 내려찍기', ring:'외곽 고리', stack:'방패 공명 · 집합' };
      const buttons = Array.from(document.querySelectorAll('[data-show]'));
      const player = { x:8.1, z:4.7, facing:3, runTime:0 };
      let target = { x:player.x,z:player.z };
      let view = 'slam', began = 0, first = null, second = null;
      let playing = false, lastTime = null, request = 0;

      function project(x,z) {
        const depth = z/plaza.radius;
        const scale = 1/(1-plaza.depth*depth);
        return {
          x:plaza.x+plaza.horizontal*x/plaza.radius*scale,
          y:plaza.y+plaza.vertical*depth*scale,
          scale
        };
      }
      function inverse(px,py) {
        const h = py-plaza.y;
        const depth = h/(plaza.vertical+plaza.depth*h);
        return {
          x:plaza.radius*(px-plaza.x)*(1-plaza.depth*depth)/plaza.horizontal,
          z:plaza.radius*depth
        };
      }
      function loop(x,z,r) {
        for (let s=0;s<=96;s++) {
          const angle = s/96*Math.PI*2;
          const q = project(x+Math.cos(angle)*r,z+Math.sin(angle)*r);
          if (s===0) ctx.moveTo(q.x,q.y);
          else ctx.lineTo(q.x,q.y);
        }
        ctx.closePath();
      }
      function shadow(x,y,rx,ry) {
        ctx.save();
        ctx.translate(x,y);
        ctx.scale(rx,ry);
        const shade = ctx.createRadialGradient(0,0,.10,0,0,1);
        shade.addColorStop(0,'#0a0c14b3');
        shade.addColorStop(1,'#0a0c1400');
        ctx.fillStyle = shade;
        ctx.fillRect(-1,-1,2,2);
        ctx.restore();
      }
      function field(shape,impact) {
        const stack = shape==='stack';
        ctx.beginPath();
        if (stack) loop(group.x,group.z,4);
        else if (shape==='ring') {
          loop(0,0,17);
          loop(0,0,8);
        } else loop(0,0,8);
        ctx.fillStyle = stack ? '#3cbbc44d' : impact ? '#ff625ab4' : '#df403a62';
        ctx.fill('evenodd');
        ctx.lineWidth = 9;
        ctx.strokeStyle = stack ? '#17383fe0' : '#5d211fe0';
        ctx.stroke();
        ctx.lineWidth = 4.8;
        ctx.strokeStyle = stack ? '#a4f5ed' : '#ffab8e';
        ctx.stroke();
        if (stack) {
          ctx.beginPath();
          loop(group.x,group.z,1);
          ctx.strokeStyle = '#c7fff9';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }
      function stepTarget(destination) {
        const length = Math.hypot(destination.x,destination.z);
        const scale = Math.max(1,length/17.15);
        target={ x:destination.x/scale, z:destination.z/scale };
        wake();
      }
      function inDanger(which) {
        const radius = Math.hypot(player.x,player.z);
        return which==='slam' ? radius <= 8 : radius > 8 && radius <= 17;
      }
      function nextSample(now) {
        if (view!=='sequence') return { overlay:view, name:names[view], pct:null };
        const t = Math.max(0,(now-began)/1000);
        if (t>=timing.slam && first===null) first=inDanger('slam');
        if (t>=timing.ring && second===null) second=inDanger('ring');
        playing = t < timing.ring+timing.trace;
        if (!playing) return { overlay:'art', name:'연계 종료', pct:null };
        const center = t<timing.slam+timing.trace;
        const strike = center ? timing.slam : timing.ring;
        const start = center ? 0 : timing.slam+timing.trace;
        const name = center ? '광장 내려찍기' : '외곽 고리';
        const overlay = t >= strike-timing.warning ? (center ? 'slam' : 'ring') : 'art';
        return { overlay,name,pct:Math.min(1,Math.max(0,(t-start)/(strike-start))),impact:t>=strike };
      }
      function placeGuardian() {
        const p = project(0,0), h = 292;
        const w = h*guardian.naturalWidth/guardian.naturalHeight;
        shadow(p.x,p.y,104,26);
        ctx.drawImage(guardian,p.x-.56*w,p.y-.96*h,w,h);
      }
      function placeIris(moving) {
        const p = project(player.x,player.z);
        const size = 174*p.scale;
        const celSize = iris.naturalHeight/4;
        const cel = moving ? 1+Math.floor(player.runTime/90)%8 : 0;
        shadow(p.x,p.y,24*p.scale,8*p.scale);
        ctx.beginPath();
        loop(player.x,player.z,.56);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#a1edffe5';
        ctx.stroke();
        ctx.drawImage(iris,cel*celSize,player.facing*celSize,celSize,celSize,
          p.x-size*.5,p.y-size*.85,size,size);
        board.dataset.cel = String(cel);
      }
      function draw(now,moving) {
        const sample = nextSample(now);
        ctx.drawImage(background,0,0,board.width,board.height);
        if (sample.overlay!=='art') field(sample.overlay,sample.impact);
        if (player.z<0) placeIris(moving);
        placeGuardian();
        if (player.z>=0) placeIris(moving);
        get('cast-name').textContent = sample.name;
        get('cast-line').hidden = sample.pct===null;
        get('cast-fill').style.transform = 'scaleX('+(sample.pct ?? 0)+')';
        let message = '전장 안에서 이리스 위치를 바꿀 수 있습니다.';
        if (view==='sequence') {
          if (!playing) {
            message = '중앙 내려찍기 '+(first ? '피격' : '회피')+' · 외곽 고리 '+(second ? '피격' : '회피');
          } else message = '시전을 보고 이동하세요. 붉은 범위는 타격 직전에 들어옵니다.';
        } else if (view==='slam' || view==='ring') {
          message = (inDanger(view) ? '이리스가 위험 범위 안에 있습니다.' : '이리스가 위험 범위 밖에 있습니다.');
        } else if (view==='stack') {
          message = Math.hypot(player.x-group.x,player.z-group.z)<=4 ? '이리스가 집합 범위 안에 있습니다.' : '이리스가 집합 범위 밖에 있습니다.';
        }
        if (status.textContent!==message) status.textContent = message;
        board.dataset.overlay = sample.overlay;
        board.dataset.view = view;
        board.dataset.x = player.x.toFixed(3);
        board.dataset.z = player.z.toFixed(3);
        board.dataset.facing = String(player.facing);
        board.dataset.playing = String(playing);
      }
      function tick(now) {
        request = 0;
        const dt = lastTime===null ? 0 : Math.min(.05,Math.max(0,(now-lastTime)/1000));
        lastTime = now;
        const dx=target.x-player.x, dz=target.z-player.z, dist=Math.hypot(dx,dz);
        if (dist>.02) {
          player.facing = Math.abs(dx)>Math.abs(dz) ? (dx>0 ? 1 : 3) : (dz>0 ? 0 : 2);
          const step = Math.min(1,dt*9/dist);
          player.x += dx*step;
          player.z += dz*step;
          player.runTime += dt*1000;
        }
        const moving = Math.hypot(target.x-player.x,target.z-player.z)>.02;
        draw(now,moving);
        if (moving || playing) wake();
        else lastTime=null;
      }
      function wake() {
        if (!request) request=requestAnimationFrame(tick);
      }

      board.addEventListener('pointerdown',event => {
        if (event.button!==0) return;
        const rect = board.getBoundingClientRect();
        const u = (event.clientX-rect.left)/rect.width*board.width;
        const v = (event.clientY-rect.top)/rect.height*board.height;
        stepTarget(inverse(u,v));
      });
      board.addEventListener('keydown',event => {
        const delta = {ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[event.key];
        if (!delta) return;
        event.preventDefault();
        stepTarget({ x:player.x+delta[0], z:player.z+delta[1] });
      });
      for (const button of buttons) {
        button.addEventListener('click',() => {
          view=button.dataset.show;
          playing=view==='sequence';
          if (playing) {
            began=performance.now();
            first=second=null;
          }
          for (const choice of buttons) choice.setAttribute('aria-pressed',String(choice===button));
          wake();
        });
        button.disabled=false;
      }
      draw(performance.now(),false);
      document.body.dataset.ready='true';
    })();
  </script>
</body>
</html>
