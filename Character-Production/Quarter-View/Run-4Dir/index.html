<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아스텔라 · 4방향 달리기</title>
<style>
* { box-sizing: border-box }
body {
  margin: 0;
  padding: 12px;
  color: var(--foreground,#f2edf4);
  background: var(--background,#181719);
  font: 14px var(--font-sans,system-ui,sans-serif);
}
main { max-width: 860px; margin: 0 auto }
h1 { margin: 0 0 12px; font-size: 19px; letter-spacing: -.025em }
[hidden] { display: none !important }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.panel {
  min-width: 0;
  border: 1px solid var(--border,#3d3742);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card,#201e23);
  color: var(--card-foreground,#f2edf4);
}
.panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  min-height: 45px;
  padding: 6px 9px;
}
.panel strong { font-size: 13px }
small { color: var(--muted-foreground,#bfb3c3) }
#position { font-variant-numeric: tabular-nums; white-space: nowrap }
.stage { display: grid; place-items: center; height: 210px; overflow: hidden; background: #342e3b }
canvas { display: block; image-rendering: pixelated }
.stage canvas { width: auto; height: 200px; max-width: 100%; object-fit: contain }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 }
button, select {
  min-height: 33px;
  padding: 4px 8px;
  border: 1px solid var(--border,#3d3742);
  border-radius: 7px;
  color: var(--foreground,#f2edf4);
  background: var(--card,#201e23);
  font: inherit;
  cursor: pointer;
}
button:hover, select:hover, button[aria-current="true"] {
  background: var(--accent,#393242);
  color: var(--accent-foreground,#fff4ff);
}
button:focus-visible, select:focus-visible {
  outline: 2px solid var(--ring,#bda1e1);
  outline-offset: 1px;
}
button[aria-current="true"] { border-color: var(--ring,#bda1e1); font-weight: 700 }
#play { min-width: 76px }
.timeline { display: grid; grid-template-columns: repeat(var(--columns,8), minmax(0,1fr)); gap: 5px }
.timeline button { padding: 4px; min-width: 0; font-size: 12px }
.timeline canvas {
  width: 100%;
  height: auto;
  max-height: 94px;
  object-fit: contain;
  background: #342e3b;
  border-radius: 4px;
}
.timeline span { display: block; margin: 3px 0 1px }
#overlay-note { margin: 8px 0 0; font-size: 12px; color: var(--muted-foreground,#bfb3c3) }
@media(max-width: 500px) {
  body { padding: 9px }
  .panels { gap: 7px }
  .stage { height: 172px }
  .stage canvas { height: 164px }
  .timeline { grid-template-columns: repeat(4,minmax(0,1fr)) }
  .timeline canvas { height: 57px }
}

  .settings { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:0 0 9px }
  .settings label { display:inline-flex; align-items:center; gap:5px }
  .panel strong { white-space:nowrap }
  button,select { min-height:36px }
#motion { color:var(--muted-foreground,#bfb3c3);font-size:13px;margin:0 0 10px }
.asset-links { display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 0;font-size:13px }
.asset-links a { color:var(--foreground,#f2edf4);text-underline-offset:3px }
.panel header select { min-height:30px;font-size:12px }
#ref-position { white-space:nowrap }
canvas { image-rendering:pixelated }
</style>
</head>
<body>
<main>
  <h1>아스텔라 · 4방향 달리기</h1>
  <div class="settings">
    <label>캐릭터 <select id="character"></select></label>
    <label>방향 <select id="direction">
      <option value="0">↓ 아래</option>
      <option value="1">→ 오른쪽</option>
      <option value="2">↑ 위</option>
      <option value="3">← 왼쪽</option>
    </select></label>
    <label>확대 <select id="zoom">
      <option value="all">전체</option>
      <option value="head">머리·표정</option>
      <option value="hands">팔·손·장비</option>
      <option value="feet">치마·다리·부츠</option>
    </select></label>
  </div>
  <p id="motion"></p>
  <div class="panels">
    <section class="panel">
      <header><strong>현재 프레임</strong><small id="position"></small></header>
      <div class="stage"><canvas id="candidate" role="img" aria-label="현재 달리기 프레임"></canvas></div>
    </section>
    <section class="panel">
      <header>
        <select id="compare" aria-label="비교할 프레임">
          <option value="-1">직전 프레임</option>
          <option value="1">다음 프레임</option>
        </select>
        <small id="ref-position"></small>
      </header>
      <div class="stage"><canvas id="reference" role="img" aria-label="비교할 달리기 프레임"></canvas></div>
    </section>
  </div>
  <div class="controls">
    <button id="prev" type="button" aria-label="이전 프레임">이전</button>
    <button id="play" type="button" aria-pressed="false">재생</button>
    <button id="next" type="button" aria-label="다음 프레임">다음</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
    </select>
    <small id="support"></small>
  </div>
  <div class="timeline" id="frames" aria-label="프레임 선택"></div>
  <p class="asset-links" id="assets">
    <a id="sheet-link">게임용 시트</a>
    <a id="frames-link">프레임별 PNG</a>
    <a id="gif-link">전체 방향 반복 GIF</a>
  </p>
  <p id="error" role="alert" hidden>캐릭터 시트를 불러오지 못했습니다.</p>
</main>

"},"sha256":{"atlas":"64df6b64818b27074701fd4c4d1950d42f94d28732a5833dd806d5e644f0eee9","frames":"18cd4fe80010c1776522cc04ef43f83bb2902988e7290140d7f880ed35953026","preview":"5fa12d791bbeb0c75d1ad459241026e2e13b2b53acd21e29abd4036f29ac1199"}},{"id":"bard","name":"음유시인","motion":"채비할 때 살짝 내려앉고 밀어 올릴 때 경쾌하게 튄다. 꽃 하프를 품에 들고 자유로운 팔에 박자를 준다.","durationsMs":[80,80,80,100,80,80,80,100],"files":{"atlas":"bard/bard_Run_4Dir.png","frames":"bard/bard_Run_4Dir_Frames.png","preview":"bard/bard_Run_4Dir_Preview.gif"},"sha256":{"atlas":"efe97948e0f269673cfec64ea63e92a4b129cc4097b64aa1e665284a6125cd27","frames":"c7d71e55097aab020fddaf859203e785b56ebdc60b1ac663be75e281ea6d20eb","preview":"6ec99730278f0cf8318d829af304946621ba93a55ace6ea6f4903cc73ca53684"}},{"id":"alchemist","name":"연금술사","motion":"양팔로 플라스크를 감싸 수평을 잡고 잰걸음으로 달린다. 고개와 손은 안정되고 가방과 옆머리가 늦게 움직인다.","durationsMs":[80,80,90,80,80,80,90,80],"files":{"atlas":"alchemist/alchemist_Run_4Dir.png","frames":"alchemist/alchemist_Run_4Dir_Frames.png","preview":"alchemist/alchemist_Run_4Dir_Preview.gif"},"sha256":{"atlas":"b2d73e8449d077bb345e793b3064c86b0d87c6a39e4088a811c161dd09499cb7","frames":"5158a0832f98191d786d32245ff94bde6ef1231d01d2d2227c5bf449fe697f31","preview":"886cdd2ba3f5c12e4591a6947ecbea1e74937601659fb6862fb19ccbba9a3912"}},{"id":"dual-blade","name":"쌍검 암살자","motion":"상체를 낮고 길게 뻗고, 칼 쥔 손은 허리 가까이 유지한다. 빠른 발 교대와 늦게 따라오는 은발이 특징이다.","durationsMs":[70,80,80,70,70,80,80,70],"files":{"atlas":"dual-blade/dual-blade_Run_4Dir.png","frames":"dual-blade/dual-blade_Run_4Dir_Frames.png","preview":"dual-blade/dual-blade_Run_4Dir_Preview.gif"},"sha256":{"atlas":"1e00de6029d9ac775d5b553acb8e172e03d04d4e8c4230e7bb596703af390169","frames":"7fd75d0599afb5ba5902038ab3b8e5c4e7aa677cc0326ac1678ff2d954ddba60","preview":"0c349d07e67f8343f3e8fb9f703962a923a817f7dc966196517b1a0d38a27c6c"}},{"id":"dragon-lancer","name":"용창사","motion":"상체를 앞으로 기울이고 뒷발로 길게 밀어낸다. 창 든 팔은 단단히 고정하고 반대 팔은 힘차게 흔든다.","durationsMs":[80,90,90,90,80,90,90,90],"files":{"atlas":"dragon-lancer/dragon-lancer_Run_4Dir.png","frames":"dragon-lancer/dragon-lancer_Run_4Dir_Frames.png","preview":"dragon-lancer/dragon-lancer_Run_4Dir_Preview.gif"},"sha256":{"atlas":"152b35f238c2df4230cf4a8798e53a2465b9670c1754c293ecd4b5add36a0a91","frames":"0346a6a8c06ba5fadc9216916a77df7913f0bee90b8404ab211562c41f85ad75","preview":"760b05dd589380f8246e821d03e0b41abbad2fd2f3f5d8d34cc3c5f6aba047da"}},{"id":"forest-archer","name":"숲의 궁수","motion":"발끝으로 가볍게 디디며 무릎을 빨리 회수한다. 시선은 진행 방향을 보고 모자 깃털과 망토가 뒤따른다.","durationsMs":[90,80,90,80,90,80,90,80],"files":{"atlas":"forest-archer/forest-archer_Run_4Dir.png","frames":"forest-archer/forest-archer_Run_4Dir_Frames.png","preview":"forest-archer/forest-archer_Run_4Dir_Preview.gif"},"sha256":{"atlas":"926988a0314ba53cf97d12d29143849173f6a98d1596b69a612c9be7f6f33aea","frames":"e2a33bf9fd29d8c59fe8573e7bc41bdfb8426c8a383bc59add3e4cf7c47184fc","preview":"38f2d27d81b11f6a5d81fd89537250d59beb49db06824ceeecbb3cf21fd45e60"}},{"id":"machinist","name":"기공사","motion":"상체를 단단하게 유지하며 규칙적으로 발을 구른다. 오른손의 장비는 어깨 쪽에 가까이 두고 왼팔을 작게 흔든다.","durationsMs":[80,90,90,80,80,90,90,80],"files":{"atlas":"machinist/machinist_Run_4Dir.png","frames":"machinist/machinist_Run_4Dir_Frames.png","preview":"machinist/machinist_Run_4Dir_Preview.gif"},"sha256":{"atlas":"27ae5b66a1f27baed2cd86a532ebe7a7a31a6c265885c9524c61d6973ce1b45e","frames":"9532d2de8ebfce294ac262349d1dae08969141d1bb600b907f3a853915930bed","preview":"341d3ccb25287c9b4419efb19d9b27414855e6fa34f93d749d690d29be4d85e6"}},{"id":"nebula-mage","name":"성운술사","motion":"가볍게 미끄러지듯 발을 앞으로 뻗으며 상체를 조용히 유지한다. 천구는 가슴 높이에서 수평을 유지한다.","durationsMs":[100,100,100,90,100,100,100,90],"files":{"atlas":"nebula-mage/nebula-mage_Run_4Dir.png","frames":"nebula-mage/nebula-mage_Run_4Dir_Frames.png","preview":"nebula-mage/nebula-mage_Run_4Dir_Preview.gif"},"sha256":{"atlas":"40dda7f2263a7426babf046c672505f2405c51c20b80a8f666b71eecbb103289","frames":"61ab3b48316a78882580be7c852df69a0a09e7effcff2c8a99deb50bbd425225","preview":"64f7b124dd30c2fb4849bafb480c591c86e49878ed1962dee5aedd10eb316cec"}},{"id":"causality-mage","name":"인과술사","motion":"상체를 안정시킨 채 보폭을 또렷하게 끊어 간다. 등 뒤 금빛 고리는 중심에 붙여 움직이고 팔은 몸 가까이 모은다.","durationsMs":[110,100,100,100,110,100,100,100],"files":{"atlas":"causality-mage/causality-mage_Run_4Dir.png","frames":"causality-mage/causality-mage_Run_4Dir_Frames.png","preview":"causality-mage/causality-mage_Run_4Dir_Preview.gif"},"sha256":{"atlas":"bd32d4117c276fee305f4e80db6f66960059e46c2ad7cfa1a0825066908efad1","frames":"32091f9f42edb17bd6a6485c5f50dbc7aa62131060558be4e7b6382534d317bd","preview":"a1b0702f7e46bf13d971d7f1897f701655ccc8a7df35fd268b2b92f9a93fc076"}}]</script>
<script>(() => {
  const get = id => document.getElementById(id);
  const roster = JSON.parse(get('roster').textContent);
  const directions = get('direction');
  const choice = get('character');
  const playButton = get('play');
  const regions = {
    all:[7,22,114,125],
    head:[13,26,102,59],
    hands:[13,70,102,51],
    feet:[12,98,104,50]
  };
  const contact = ['왼발 착지','왼발 지지','왼발 밀기','공중','오른발 착지','오른발 지지','오른발 밀기','공중'];
  const sprites = new Map();
  let frame = 0, playing = false, previous = null, elapsed = 0, request = 0;
  let sheet, character, revision = 0;

  for (const item of roster) choice.add(new Option(item.name, item.id));
  if (roster.some(item => item.id === location.hash.slice(1))) choice.value = location.hash.slice(1);
  const thumbs = [];
  for (let index = 0; index < 8; index++) {
    const button = document.createElement('button');
    const canvas = document.createElement('canvas');
    const number = document.createElement('span');
    button.type = 'button';
    button.ariaLabel = (index + 1) + '번 프레임';
    canvas.ariaHidden = 'true';
    number.textContent = index + 1;
    button.append(canvas, number);
    button.addEventListener('click', () => stepTo(index));
    get('frames').append(button);
    thumbs.push({button, canvas});
  }

  function update(canvas, index, crop) {
    const [x,y,width,height] = crop;
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    const row = Number(directions.value);
    const paint = canvas.getContext('2d');
    paint.imageSmoothingEnabled = false;
    paint.clearRect(0,0,width,height);
    paint.drawImage(sheet, 128 * index + x, 160 * row + y, width,height, 0,0,width,height);
  }

  function draw() {
    if (!sheet) return;
    const other = (frame + Number(get('compare').value) + 8) % 8;
    const crop = regions[get('zoom').value];
    update(get('candidate'),frame,crop);
    update(get('reference'),other,crop);
    get('position').textContent = (frame + 1) + ' / 8';
    get('ref-position').textContent = (other + 1) + ' / 8';
    get('support').textContent = contact[frame];
    document.body.dataset.frame = frame + 1;
    for (const [i,thumb] of thumbs.entries()) thumb.button.ariaCurrent = String(i === frame);
  }

  function timeline() {
    if (!sheet) return;
    for (const [i,thumb] of thumbs.entries()) update(thumb.canvas,i,regions.all);
  }

  function setPlaying(value) {
    playing = value;
    previous = null;
    elapsed = 0;
    cancelAnimationFrame(request);
    playButton.textContent = playing ? '일시정지' : '재생';
    playButton.ariaPressed = String(playing);
    if (playing) request = requestAnimationFrame(tick);
  }

  function tick(time) {
    if (!playing) return;
    const duration = character.durationsMs[frame] / Number(get('speed').value);
    if (previous !== null) elapsed += Math.min(time - previous, duration);
    previous = time;
    if (elapsed >= duration) {
      elapsed -= duration;
      frame = (frame + 1) % 8;
      draw();
    }
    request = requestAnimationFrame(tick);
  }

  function stepTo(index) {
    if (!sheet) return;
    setPlaying(false);
    frame = (index + 8) % 8;
    draw();
  }

  async function loadCharacter() {
    const selecting = ++revision;
    setPlaying(false);
    document.body.dataset.ready = 'false';
    playButton.disabled = true;
    const entry = roster.find(item => item.id === choice.value);
    get('motion').textContent = entry.motion;
    get('error').hidden = true;
    get('assets').hidden = !entry.files;
    if (entry.files) {
      get('sheet-link').href = entry.files.atlas;
      get('frames-link').href = entry.files.frames;
      get('gif-link').href = entry.files.preview;
    }
    try {
      if (!sprites.has(entry.id)) {
        const image = new Image();
        image.src = entry.image || entry.files.atlas;
        sprites.set(entry.id,image.decode().then(() => {
          if (image.naturalWidth !== 1024 || image.naturalHeight !== 640) throw new Error('Wrong sprite dimensions.');
          return image;
        }));
      }
      const next = await sprites.get(entry.id);
      if (selecting !== revision) return;
      sheet = next;
      character = entry;
      frame = 0;
      timeline();
      draw();
      document.body.dataset.ready = 'true';
      document.body.dataset.character = entry.id;
      playButton.disabled = false;
    } catch {
      sprites.delete(entry.id);
      if (selecting !== revision) return;
      sheet = null;
      character = null;
      for (const canvas of document.querySelectorAll('canvas')) {
        canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
      }
      get('error').hidden = false;
      get('position').textContent = '';
      get('ref-position').textContent = '';
      get('support').textContent = '';
    }
  }

  choice.addEventListener('change',loadCharacter);
  directions.addEventListener('change',() => { timeline(); draw(); });
  get('zoom').addEventListener('change',draw);
  get('compare').addEventListener('change',draw);
  get('speed').addEventListener('change',() => { previous = null; elapsed = 0; });
  get('prev').addEventListener('click',() => stepTo(frame - 1));
  get('next').addEventListener('click',() => stepTo(frame + 1));
  playButton.addEventListener('click',() => { if (sheet && !playButton.disabled) setPlaying(!playing); });
  document.addEventListener('visibilitychange',() => { previous = null; });
  loadCharacter();
})();
</script>
</body>
</html>
