  <style>
    html {
      color-scheme:light dark;
      background:var(--background,#f9fbfe);
      color:var(--foreground,#182746);
    }
    body {
      margin:0;
      font-family:var(--font-sans,system-ui,sans-serif);
    }
    main {
      max-width:900px;
      margin:0 auto;
      padding:16px clamp(10px,3vw,28px) 24px;
    }
    h1 {
      font-size:clamp(23px,4vw,32px);
      letter-spacing:-.035em;
      margin:5px 0 2px;
    }
    .summary {
      color:var(--muted-foreground,#51617e);
      font-size:14px;
      margin:4px 0 18px;
    }
    .controls {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      margin:0 0 12px;
    }
    .controls label {
      font-size:13px;
      font-weight:700;
    }
    select,button,#sheet {
      font:inherit;
      font-size:14px;
      box-sizing:border-box;
      min-height:38px;
      padding:8px 11px;
      border:1px solid var(--border,#ccd8e9);
      border-radius:var(--radius,8px);
      background:var(--card,#fff);
      color:var(--card-foreground,#243a5d);
    }
    button,#sheet {
      cursor:pointer;
    }
    #sheet {
      text-decoration:none;
    }
    button[aria-pressed=true] {
      background:var(--accent,#30476e);
      color:var(--accent-foreground,#fff);
    }
    :focus-visible {
      outline:2px solid var(--ring,#46649e);
      outline-offset:2px;
    }
    .grid {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:9px;
    }
    .grid.pairs {
      grid-template-columns:repeat(2,minmax(0,1fr));
      max-width:560px;
      margin:0 auto;
    }
    .tile {
      margin:0;
      display:block;
      min-width:0;
      background:var(--muted,#eef3fa);
      color:var(--foreground,#182746);
      border:1px solid var(--border,#ccd8e9);
      border-radius:var(--radius,10px);
      overflow:hidden;
      text-decoration:none;
    }
    .tile:hover {
      border-color:var(--ring,#889fc7);
    }
    .image-window {
      display:block;
      position:relative;
      overflow:hidden;
      aspect-ratio:128/144;
    }
    .image-window.reflection {
      transform:scaleX(-1);
    }
    img {
      display:block;
      width:100%;
      height:auto;
      image-rendering:pixelated;
    }
    .atlas {
      position:absolute;
      width:400%;
      max-width:none;
    }
    .label {
      display:block;
      text-align:center;
      font-size:13px;
      font-weight:650;
      padding:2px 3px 11px;
    }
    @media(max-width:570px) {
      .grid {
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
      main {
        padding-top:10px;
      }
      .label {
        font-size:12px;
      }
    }
  </style>
</head>

      <a id="sheet" download>시트 PNG</a>
    </div>
    <div class="grid" id="directions"></div>

  <script>
    const app = JSON.parse(document.getElementById('catalog').textContent);
    const character = document.getElementById('character');
    const grid = document.getElementById('directions');
    const toggle = document.getElementById('flow');
    const sheet = document.getElementById('sheet');
    let comparison = false;
    for (const entry of app.characters) character.add(new Option(entry.name, entry.id));
    const initial = new URLSearchParams(location.search).get('character');
    if (initial && app.characters.some(entry => entry.id === initial)) character.value = initial;

    function render() {
        const record = app.characters.find(entry => entry.id === character.value);
        const positions = comparison ? [1,7,2,6,3,5] : [0,1,2,3,4,5,6,7];
        grid.replaceChildren();
        grid.classList.toggle('pairs', comparison);
        if (sheet) sheet.href = record.atlas;
        for (const [i,point] of positions.entries()) {
            const reverse = comparison && i % 2 === 1;
            const direction = app.directions[point];
            const label = direction.arrow + ' ' + direction.label + (reverse ? ' \u00b7 \ubc18\uc804' : '');
            const tile = document.createElement(app.inline ? 'figure' : 'a');
            tile.className = 'tile';
            tile.dataset.direction = direction.id;
            if (!app.inline) { tile.href = record.tiles[point]; tile.download = ''; }
            const crop = document.createElement('span');
            crop.className = 'image-window' + (reverse ? ' reflection' : '');
            const image = document.createElement('img');
            image.alt = record.name + ' ' + label;
            if (app.inline) {
                image.width = 512;
                image.height = 288;
                image.className = 'atlas';
                image.style.left = (- (point % 4) * 100) + '%';
                image.style.top = (- Math.floor(point / 4) * 100) + '%';
                image.src = record.data;
            } else {
                image.width = 128;
                image.height = 144;
                image.src = record.tiles[point];
            }
            const caption = document.createElement('span');
            caption.className = 'label';
            caption.textContent = label;
            crop.append(image);
            tile.append(crop, caption);
            grid.append(tile);
        }
    }
    character.addEventListener('change', render);
    if (toggle) toggle.addEventListener('click', () => {
        comparison = !comparison;
        toggle.setAttribute('aria-pressed', String(comparison));
        render();
    });
    render();
  </script>
