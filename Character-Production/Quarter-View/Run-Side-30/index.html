<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아스텔라 · 30° 좌우 달리기</title>
<style>
* { box-sizing: border-box }
body {
  margin: 0;
  padding: 12px;
  color: var(--foreground,#f2edf4);
  background: var(--background,#181719);
  font: 14px var(--font-sans,system-ui,sans-serif);
}
main { max-width: 860px; margin: 0 auto }
h1 { margin: 0 0 12px; font-size: 19px; letter-spacing: -.025em }
[hidden] { display: none !important }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.panel {
  min-width: 0;
  border: 1px solid var(--border,#3d3742);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card,#201e23);
  color: var(--card-foreground,#f2edf4);
}
.panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  min-height: 45px;
  padding: 6px 9px;
}
.panel strong { font-size: 13px }
small { color: var(--muted-foreground,#bfb3c3) }
#position { font-variant-numeric: tabular-nums; white-space: nowrap }
.stage { display: grid; place-items: center; height: 210px; overflow: hidden; background: #342e3b }
canvas { display: block; image-rendering: pixelated }
.stage canvas { width: auto; height: 200px; max-width: 100%; object-fit: contain }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 }
button, select {
  min-height: 33px;
  padding: 4px 8px;
  border: 1px solid var(--border,#3d3742);
  border-radius: 7px;
  color: var(--foreground,#f2edf4);
  background: var(--card,#201e23);
  font: inherit;
  cursor: pointer;
}
button:hover, select:hover, button[aria-current="true"] {
  background: var(--accent,#393242);
  color: var(--accent-foreground,#fff4ff);
}
button:focus-visible, select:focus-visible {
  outline: 2px solid var(--ring,#bda1e1);
  outline-offset: 1px;
}
button[aria-current="true"] { border-color: var(--ring,#bda1e1); font-weight: 700 }
#play { min-width: 76px }
.timeline { display: grid; grid-template-columns: repeat(var(--columns,8), minmax(0,1fr)); gap: 5px }
.timeline button { padding: 4px; min-width: 0; font-size: 12px }
.timeline canvas {
  width: 100%;
  height: auto;
  max-height: 94px;
  object-fit: contain;
  background: #342e3b;
  border-radius: 4px;
}
.timeline span { display: block; margin: 3px 0 1px }
#overlay-note { margin: 8px 0 0; font-size: 12px; color: var(--muted-foreground,#bfb3c3) }
@media(max-width: 500px) {
  body { padding: 9px }
  .panels { gap: 7px }
  .stage { height: 172px }
  .stage canvas { height: 164px }
  .timeline { grid-template-columns: repeat(4,minmax(0,1fr)) }
  .timeline canvas { height: 57px }
}

  .settings { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:0 0 9px }
  .settings label { display:inline-flex; align-items:center; gap:5px }
  .panel strong { white-space:nowrap }
  button,select { min-height:36px }
#motion { color:var(--muted-foreground,#bfb3c3);font-size:13px;margin:0 0 10px }
.asset-links { display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 0;font-size:13px }
.asset-links a { color:var(--foreground,#f2edf4);text-underline-offset:3px }
.panel header select { min-height:30px;font-size:12px }
#ref-position { white-space:nowrap }
canvas { image-rendering:pixelated }
#arena { margin:14px 0 0 }
#arena summary { cursor:pointer;margin-bottom:8px;color:var(--foreground,#f2edf4);font-size:13px }
#arena-canvas { display:block; width:100%; max-width:634px; height:auto; border-radius:8px }
</style>
</head>
<body>
<main>
  <h1>아스텔라 · 30° 좌우 달리기</h1>
  <div class="settings">
    <label>캐릭터 <select id="character"></select></label>
    <label>방향 <select id="direction">
      <option value="0">→ 오른쪽</option>
      <option value="1">← 왼쪽</option>
    </select></label>
    <label>확대 <select id="zoom">
      <option value="all">전체</option>
      <option value="head">머리·표정</option>
      <option value="hands">팔·손·장비</option>
      <option value="feet">치마·다리·부츠</option>
    </select></label>
  </div>
  <p id="motion"></p>
  <div class="panels">
    <section class="panel">
      <header><strong>30° 프레임</strong><small id="position"></small></header>
      <div class="stage"><canvas id="candidate" role="img" aria-label="현재 달리기 프레임"></canvas></div>
    </section>
    <section class="panel">
      <header>
        <select id="compare" aria-label="비교할 프레임">
          <option value="-1">직전 프레임</option>
          <option value="1">다음 프레임</option>
          <option value="idle" hidden>게임 원본 대기</option>
          <option value="before" hidden>수정 전</option>
        </select>
        <small id="ref-position"></small>
      </header>
      <div class="stage"><canvas id="reference" role="img" aria-label="비교할 달리기 프레임"></canvas></div>
    </section>
  </div>
  <div class="controls">
    <button id="prev" type="button" aria-label="이전 프레임">이전</button>
    <button id="play" type="button" aria-pressed="false">재생</button>
    <button id="next" type="button" aria-label="다음 프레임">다음</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
    </select>
    <small id="support"></small>
  </div>
  <div class="timeline" id="frames" aria-label="프레임 선택"></div>
  <details id="arena" hidden>
    <summary>전장 크기로 보기</summary>
    <canvas id="arena-canvas" width="634" height="538" role="img" aria-label="전장 구도에서 달리는 선택 캐릭터"></canvas>
  </details>
  <p class="asset-links" id="assets">
    <a id="sheet-link">게임용 시트</a>
    <a id="frames-link">프레임별 PNG</a>
    <a id="gif-link">좌우 반복 GIF</a>
  </p>
  <p id="error" role="alert" hidden>캐릭터 시트를 불러오지 못했습니다.</p>
</main>

    feet:[12,102,104,45]
  };
  const contact = ['왼발 착지','왼발 지지','왼발 밀기','공중','오른발 착지','오른발 지지','오른발 밀기','공중'];
  const sprites = new Map();
  const comparisons = new Map();
  const arena = get('arena');
  const arenaCanvas = get('arena-canvas');
  const arenaImage = new Image();
  const arenaSource = JSON.parse(get('arena-data').textContent);
  let arenaReady = false;
  let frame = 0, playing = false, previous = null, elapsed = 0, request = 0;
  let sheet, referenceSheet, character, revision = 0, referenceVersion = 0, baselineFailed = false;

  for (const item of roster) choice.add(new Option(item.name, item.id));
  if (roster.some(item => item.id === location.hash.slice(1))) choice.value = location.hash.slice(1);
  const thumbs = [];
  for (let index = 0; index < 8; index++) {
    const button = document.createElement('button');
    const canvas = document.createElement('canvas');
    const number = document.createElement('span');
    button.type = 'button';
    button.ariaLabel = (index + 1) + '번 프레임';
    canvas.ariaHidden = 'true';
    number.textContent = index + 1;
    button.append(canvas, number);
    button.addEventListener('click', () => stepTo(index));
    get('frames').append(button);
    thumbs.push({button, canvas});
  }

  function fitPixels(canvas) {
    const stage = canvas.parentElement;
    if (!stage.classList.contains('stage')) return;
    const ratio = window.devicePixelRatio || 1;
    const zoom = Math.floor(Math.min(stage.clientWidth * ratio / canvas.width,
      (stage.clientHeight - 6) * ratio / canvas.height));
    if (zoom < 1) {
      canvas.style.width = '';
      canvas.style.height = '';
      canvas.style.transform = '';
      delete canvas.dataset.pixelScale;
      return;
    }
    canvas.style.width = (canvas.width * zoom / ratio) + 'px';
    canvas.style.height = (canvas.height * zoom / ratio) + 'px';
    canvas.style.transform = '';
    const {left,top} = canvas.getBoundingClientRect();
    canvas.style.transform = 'translate(' + ((Math.round(left * ratio) - left * ratio) / ratio) +
      'px,' + ((Math.round(top * ratio) - top * ratio) / ratio) + 'px)';
    canvas.dataset.pixelScale = zoom;
  }

  const rasterViews = [get('candidate'),get('reference')];
  const fitViews = () => rasterViews.forEach(fitPixels);
  if (typeof ResizeObserver === 'function') {
    const resized = new ResizeObserver(fitViews);
    for (const canvas of rasterViews) resized.observe(canvas.parentElement);
  }
  window.addEventListener('resize',fitViews);
  window.addEventListener('scroll',fitViews,{passive:true});

  function update(canvas, index, crop, image = sheet, layout='candidate') {
    const [x,y,width,height] = crop;
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      fitPixels(canvas);
    }
    const row = Number(directions.value);
    const paint = canvas.getContext('2d');
    paint.imageSmoothingEnabled = false;
    paint.clearRect(0,0,width,height);
    if (!image) return;
    const column = layout==='idle' ? 2 : index;
    const top = layout==='idle' ? row*144 : layout==='before' ? (2*row+1)*160 : row*160;
    const sourceHeight = layout==='idle' ? Math.min(height,144-y) : height;
    paint.drawImage(image,128*column+x,top+y,width,sourceHeight,0,0,width,sourceHeight);
  }

  function draw() {
    if (!sheet) return;
    const mode=get('compare').value;
    const fromOtherSheet=mode==='before' || mode==='idle';
    const other = fromOtherSheet ? frame : (frame + Number(mode) + 8) % 8;
    const crop = regions[get('zoom').value];
    update(get('candidate'),frame,crop);
    update(get('reference'),other,crop,fromOtherSheet ? (referenceSheet || null) : sheet,mode);
    get('position').textContent = (frame + 1) + ' / 8';
    get('ref-position').textContent = fromOtherSheet && !referenceSheet ?
      (baselineFailed ? '불러오기 실패' : '불러오는 중') : mode==='idle' ? '대기' : (other + 1) + ' / 8';
    get('support').textContent = contact[frame];
    document.body.dataset.frame = frame + 1;
    for (const [i,thumb] of thumbs.entries()) thumb.button.ariaCurrent = String(i === frame);
    drawArena();
  }

  function drawArena() {
    if (!arenaReady || !arena.open || !sheet) return;
    const paint = arenaCanvas.getContext('2d');
    const row = Number(directions.value);
    const x = 410, y = 376, scale = .8;
    paint.imageSmoothingEnabled = false;
    paint.drawImage(arenaImage,0,0,arenaCanvas.width,arenaCanvas.height);
    paint.fillStyle = 'rgba(45,32,63,.26)';
    paint.beginPath();
    paint.ellipse(x,y+2,20,6,0,0,Math.PI*2);
    paint.fill();
    paint.drawImage(sheet,128*frame,160*row,128,160,
      Math.round(x-64*scale),Math.round(y-128*scale),Math.round(128*scale),Math.round(160*scale));
  }

  function timeline() {
    if (!sheet) return;
    for (const [i,thumb] of thumbs.entries()) update(thumb.canvas,i,regions.all);
  }

  function setPlaying(value) {
    playing = value;
    previous = null;
    elapsed = 0;
    cancelAnimationFrame(request);
    playButton.textContent = playing ? '일시정지' : '재생';
    playButton.ariaPressed = String(playing);
    if (playing) request = requestAnimationFrame(tick);
  }

  function tick(time) {
    if (!playing) return;
    const duration = character.durationsMs[frame] / Number(get('speed').value);
    if (previous !== null) elapsed += Math.min(time - previous, duration);
    previous = time;
    if (elapsed >= duration) {
      elapsed -= duration;
      frame = (frame + 1) % 8;
      draw();
    }
    request = requestAnimationFrame(tick);
  }

  function stepTo(index) {
    if (!sheet) return;
    setPlaying(false);
    frame = (index + 8) % 8;
    draw();
  }

  async function loadCharacter() {
    const selecting = ++revision;
    setPlaying(false);
    document.body.dataset.ready = 'false';
    playButton.disabled = true;
    const entry = roster.find(item => item.id === choice.value);
    for(const item of ['before','idle'])get('compare').querySelector('[value="'+item+'"]').hidden=!entry[item];
    if (get('compare').selectedOptions[0].hidden) get('compare').value = '-1';
    get('motion').textContent = entry.motion;
    get('error').hidden = true;
    get('assets').hidden = !entry.files;
    if (entry.files) {
      get('sheet-link').href = entry.files.atlas;
      get('frames-link').href = entry.files.frames;
      get('gif-link').href = entry.files.preview;
    }
    try {
      if (!sprites.has(entry.id)) {
        const image = new Image();
        image.src = entry.image || entry.files.atlas;
        sprites.set(entry.id,image.decode().then(() => {
          if (image.naturalWidth !== 1024 || image.naturalHeight !== 320) throw new Error('Wrong sprite dimensions.');
          return image;
        }));
      }
      const next = await sprites.get(entry.id);
      if (selecting !== revision) return;
      sheet = next;
      character = entry;
      referenceSheet = null;
      baselineFailed = false;
      frame = entry.focus?.frame ?? 0;
      if (entry.focus) {
        directions.value = entry.focus.direction;
        get('zoom').value = entry.focus.zoom || 'all';
        get('compare').value = entry.focus.compare || 'idle';
      }
      timeline();
      draw();
      document.body.dataset.ready = 'true';
      document.body.dataset.character = entry.id;
      playButton.disabled = false;
      loadComparison();
    } catch {
      sprites.delete(entry.id);
      if (selecting !== revision) return;
      sheet = null;
      character = null;
      for (const canvas of document.querySelectorAll('canvas')) {
        canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
      }
      get('error').hidden = false;
      get('position').textContent = '';
      get('ref-position').textContent = '';
      get('support').textContent = '';
    }
  }

  async function loadComparison() {
    const entry = character;
    const mode=get('compare').value;
    const requested=entry?.[mode];
    const choosing=++referenceVersion;
    referenceSheet=null;
    if (!requested || (mode!=='before' && mode!=='idle')) {
      draw();
      return;
    }
    const selecting = revision;
    baselineFailed = false;
    const key=entry.id+'/'+mode;
    if (!comparisons.has(key)) {
      const image = new Image();
      image.src = requested;
      comparisons.set(key,image.decode().then(() => {
        const [width,height]=mode==='before'?[1024,640]:[512,288];
        if (image.naturalWidth!==width || image.naturalHeight!==height)throw new Error('Wrong comparison dimensions.');
        return image;
      }));
    }
    draw();
    try {
      const image = await comparisons.get(key);
      if (selecting !== revision || choosing!==referenceVersion) return;
      referenceSheet = image;
      draw();
    } catch {
      comparisons.delete(key);
      if (selecting === revision && choosing===referenceVersion) {
        baselineFailed = true;
        draw();
      }
    }
  }

  choice.addEventListener('change',loadCharacter);
  directions.addEventListener('change',() => { timeline(); draw(); });
  get('zoom').addEventListener('change',draw);
  get('compare').addEventListener('change',loadComparison);
  get('speed').addEventListener('change',() => { previous = null; elapsed = 0; });
  get('prev').addEventListener('click',() => stepTo(frame - 1));
  get('next').addEventListener('click',() => stepTo(frame + 1));
  playButton.addEventListener('click',() => { if (sheet && !playButton.disabled) setPlaying(!playing); });
  arena.addEventListener('toggle',drawArena);
  if (arenaSource) {
    arenaImage.onload = () => {
      arenaReady = true;
      arena.hidden = false;
      drawArena();
    };
    arenaImage.src = arenaSource;
  }
  document.addEventListener('visibilitychange',() => { previous = null; });
  loadCharacter();
})();
</script>
</body>
</html>
