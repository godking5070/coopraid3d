<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이리스 · 8방향 도트</title>
<style>
:root{font:15px/1.55 "Malgun Gothic",system-ui,sans-serif;color:#1d2840;background:#f7f4ee;--ink:#222f4d;--muted:#58647a;--surface:#fffdf9;--line:#d8dce5;--stage:#dfe8f2}
*{box-sizing:border-box}
body{margin:0}
.wrap{width:min(1250px,100%);margin:auto;padding-inline:24px}
header{background:var(--ink);color:#f8f0e4;padding-block:24px 28px;border-bottom:4px solid #c8a873}
header a{color:#ffe2ab}
h1{margin:7px 0 6px;font-size:clamp(27px,4vw,45px);line-height:1.13;letter-spacing:-.06em}
header p{margin:0;color:#e1e7f2}
main{padding-block:22px 32px}
a{color:#23517b;text-underline-offset:3px}
button,select,.file{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button,select{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #6285bb;outline-offset:3px}
button[aria-pressed="true"]{background:#263758;color:#fff;border-color:#263758}
.picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.62fr);gap:15px}
.stage,.panel,.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage,.tile .mini{background:var(--stage)}
body[data-background="dark"]{--stage:#2d3a54}
body[data-background="grid"] :is(.stage,.tile .mini){background-color:#f3f1ec;background-image:repeating-conic-gradient(#d7dbe4 0% 25%,transparent 0% 50%);background-size:16px 16px}
.stage{min-height:310px;display:grid;place-items:center}
.stage img{display:block;image-rendering:pixelated;width:min(288px,100%);height:auto}
.panel{background:var(--surface);padding:17px;min-width:0}
.panel h2{font-size:20px;margin:0 0 3px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:10px 0 14px;max-width:310px}
.pad button{min-height:44px;padding:4px;font-size:21px;line-height:1}
.scene-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.file{display:inline-flex;color:#23517b;text-decoration:none;font-weight:670;font-size:13px}
.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:15px 0}
.tile{background:var(--surface);min-width:0}
.tile .mini{width:100%;border:0;border-radius:0;display:grid;place-items:center;padding:0}
.mini img{image-rendering:pixelated;display:block;width:min(128px,100%);height:auto}
.tile .mini[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #446a9e}
.tile-footer{padding:8px;display:flex;gap:3px 8px;justify-content:space-between;flex-wrap:wrap;align-items:center;font-size:12px}
.tile-footer span{white-space:nowrap;font-weight:680}
.links{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
@media(max-width:850px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding-inline:13px}.picker{grid-template-columns:1fr}.stage{min-height:218px}.stage img{width:208px}.panel{padding:12px}.pad{max-width:none}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body data-background="light">
<header>
  <div class="wrap">
    <a href="../Front-Variations/index.html">정면 도트 시안</a>
    <h1>이리스 8방향 도트</h1>
    <p>첫 번째 정면 도트와 일곱 방향의 전신 대기 자세입니다.</p>
  </div>
</header>
<main class="wrap">
  <section class="picker" aria-labelledby="heading">
    <div class="stage"><img id="stage-art" src="Sprites/Iris_Idle_s.png" alt="이리스 정면" width="128" height="144"></div>
    <div class="panel">
      <h2 id="heading" aria-live="polite">↓ 정면</h2>
      <p>위쪽은 뒷모습, 아래쪽은 정면입니다. 숫자 키패드로도 돌려볼 수 있습니다.</p>
      <div class="pad" id="pad" role="group" aria-label="방향 선택"></div>
      <div class="scene-controls">
        <label for="background">배경</label>
        <select id="background"><option value="light">밝게</option><option value="dark">어둡게</option><option value="grid">투명 격자</option></select>
        <a class="file" id="current-file" href="Sprites/Iris_Idle_s.png" download>이 방향 PNG</a>
      </div>
    </div>
  </section>
  <div class="strip" id="strip" aria-label="여덟 방향 썸네일"></div>
  <nav class="links" aria-label="리소스 파일">
    <a class="file" href="Iris_Idle_8Dir.png" download>8방향 시트 PNG</a>
    <a href="directions.json">프레임 좌표와 발 기준점</a>
    <a href="../Front-Variations/Sprites/01-classic-front.png">첫 번째 정면 원본</a>
    <a href="imagegen-prompts.txt">생성 프롬프트</a>
    <span>128 × 144 px / 칸</span>
  </nav>
</main>
<script id="sprite-data" type="application/json">{"frames":[{"id":"s","label":"정면","arrow":"↓","key":"2","file":"Sprites/Iris_Idle_s.png"},{"id":"se","label":"오른쪽 앞","arrow":"↘","key":"3","file":"Sprites/Iris_Idle_se.png"},{"id":"e","label":"오른쪽 옆","arrow":"→","key":"6","file":"Sprites/Iris_Idle_e.png"},{"id":"ne","label":"오른쪽 뒤","arrow":"↗","key":"9","file":"Sprites/Iris_Idle_ne.png"},{"id":"n","label":"뒷모습","arrow":"↑","key":"8","file":"Sprites/Iris_Idle_n.png"},{"id":"nw","label":"왼쪽 뒤","arrow":"↖","key":"7","file":"Sprites/Iris_Idle_nw.png"},{"id":"w","label":"왼쪽 옆","arrow":"←","key":"4","file":"Sprites/Iris_Idle_w.png"},{"id":"sw","label":"왼쪽 앞","arrow":"↙","key":"1","file":"Sprites/Iris_Idle_sw.png"}]}</script>
<script>
const get = id => document.getElementById(id);
const {frames} = JSON.parse(get('sprite-data').textContent);
const byId = new Map(frames.map(frame => [frame.id, frame]));
const picks = [];
function button(frame, panel, short) {
  const choice = document.createElement('button');
  choice.type = 'button';
  choice.title = frame.label + ' · ' + frame.key;
  choice.setAttribute('aria-label', frame.label);
  choice.addEventListener('click', () => face(frame));
  if (short) choice.textContent = frame.arrow;
  panel.append(choice);
  picks.push({choice, id:frame.id});
  return choice;
}
function face(frame) {
  const art = get('stage-art');
  art.src = frame.file;
  art.alt = '이리스 ' + frame.label;
  get('heading').textContent = frame.arrow + ' ' + frame.label;
  get('current-file').href = frame.file;
  for (const pick of picks) pick.choice.setAttribute('aria-pressed', String(pick.id === frame.id));
}
for (const id of ['nw','n','ne','w','','e','sw','s','se']) {
  if (id) button(byId.get(id), get('pad'), true);
  else get('pad').append(document.createElement('span'));
}
for (const frame of frames) {
  const tile = document.createElement('article');
  tile.className = 'tile';
  const choice = button(frame, tile, false);
  choice.className = 'mini';
  const art = document.createElement('img');
  art.src = frame.file; art.alt = ''; art.width = 128; art.height = 144;
  choice.append(art);
  const footer = document.createElement('div');
  footer.className = 'tile-footer';
  const caption = document.createElement('span');
  caption.textContent = frame.arrow + ' ' + frame.label;
  const save = document.createElement('a');
  save.href = frame.file; save.download = ''; save.textContent = 'PNG';
  save.setAttribute('aria-label', frame.label + ' PNG');
  footer.append(caption, save);
  tile.append(footer);
  get('strip').append(tile);
}
get('background').addEventListener('change', event => document.body.dataset.background = event.target.value);
document.addEventListener('keydown', event => {
  if (!event.code.startsWith('Numpad') || event.target.closest?.('select,input,textarea')) return;
  const direction = frames.find(frame => frame.key === event.key);
  if (!direction) return;
  event.preventDefault();
  face(direction);
});
face(byId.get('s'));
</script>
</body>
</html>
