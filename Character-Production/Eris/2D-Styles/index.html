<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이리스 · 2D 스프라이트 시안</title>
<style>
:root{font:15px/1.55 Pretendard,"Malgun Gothic",system-ui,sans-serif;color:#1d2840;background:#f7f4ee;--ink:#1d2840;--muted:#56627a;--line:#d9dce4;--surface:#fffdf9;--stage:#dfe8f2;--size:208px;--accent:#234a76}
*{box-sizing:border-box}
body{margin:0}
button,select,input{font:inherit;color:inherit}
button,select,.download{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:38px;padding:7px 12px}
button,select{cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #6285bb;outline-offset:3px}
a{color:var(--accent);text-underline-offset:3px}
[hidden]{display:none!important}
.wrap{width:min(1360px,100%);margin:auto;padding:0 28px}
header{background:#222f4d;color:#f8f1e3;border-bottom:4px solid #c8a873}
.banner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:26px;min-height:212px;padding-top:30px;padding-bottom:30px;overflow:hidden}
.banner img{width:142px;height:164px;object-fit:contain;flex:none}
.banner h1{font-size:clamp(26px,4.8vw,54px);font-weight:760;line-height:1.06;letter-spacing:-.045em;margin:0 0 14px}
.banner p{max-width:590px;margin:0 0 17px;color:#e2e8f6}
.banner nav{display:flex;gap:16px;flex-wrap:wrap}
.banner nav a{color:#ffe2ab;font-weight:650}
main{padding-top:28px;padding-bottom:44px}
.controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px 18px;margin:0 0 17px}
.control{display:grid;gap:4px;color:var(--muted);font-size:13px}
.control select{min-width:132px;color:var(--ink)}
.range-value{display:flex;align-items:center;gap:8px;min-height:38px}
.range-value input{width:136px;accent-color:var(--accent)}
output{min-width:44px;font-variant-numeric:tabular-nums}
.count{margin:0 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}
.card,.motion-card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.art,.motion-art,.dialog-art{background:var(--stage)}
body[data-background=dark]{--stage:#293651}
body[data-background=grid] :is(.art,.motion-art,.dialog-art){background-color:#f2f1ee;background-image:repeating-conic-gradient(#d9dce3 0% 25%,transparent 0% 50%);background-position:50% 50%;background-size:18px 18px}
.art{width:100%;min-height:248px;border:0;border-radius:0;display:grid;place-items:center;padding:9px}
.art img{display:block;width:auto;max-width:100%;height:var(--size);object-fit:contain}
.pixel{image-rendering:pixelated}
.card-copy{padding:12px}
.card h3,.motion-card h3{margin:0;color:var(--ink);font-size:15px;font-weight:700}
.card p{margin:2px 0 10px;color:var(--muted);font-size:12px}
.card-actions{display:flex;gap:6px;justify-content:space-between;align-items:center}
.card-actions button,.card-actions a{margin:0;padding:4px 9px;min-height:30px;font-size:12px}
.download{display:inline-flex;align-items:center;text-decoration:none;color:var(--accent);font-weight:650}
section+section{margin-top:42px}
h2{margin:0 0 7px;font-size:24px;letter-spacing:-.035em}
.intro{margin:0 0 15px;color:var(--muted)}
.movie-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.movie-controls span{color:var(--muted);font-size:13px}
.motion-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.motion-card header{background:var(--surface);border:0;color:var(--ink);padding:12px}
.motion-art{display:grid;place-items:center;padding:6px}
.motion-art canvas{width:min(100%,420px);height:auto;aspect-ratio:420/300}
.motion-card footer{padding:9px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:13px}
.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px;color:var(--muted);font-size:13px}
dialog{width:min(680px,calc(100% - 26px));max-height:calc(100% - 26px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0e172dda}
.dialog-copy{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dialog-copy h2{font-size:19px;margin:0}
.dialog-copy p{font-size:13px;color:var(--muted);margin:2px 0 0}
.dialog-art{display:grid;place-items:center;padding:14px}
.dialog-art img{display:block;max-height:min(65vh,700px);max-width:100%;object-fit:contain}
@media(max-width:660px){.wrap{padding-left:15px;padding-right:15px}.banner{min-height:180px}.banner img{width:84px;height:120px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{min-height:204px}.motion-grid{grid-template-columns:1fr}}
@media(max-width:380px){.banner img{display:none}.controls{gap:10px}.control select{min-width:110px}.card-copy{padding:9px}}
</style>
</head>
<body data-background="light">
<header>
  <div class="wrap banner">
    <div>
      <h1>이리스 2D 스프라이트</h1>
      <p>전신 대기 시안 30종을 비교하고, 도트풍과 셀 채색의 걷기·별꽃 마법을 재생할 수 있습니다.</p>
      <nav aria-label="페이지 내 이동"><a href="#styles">그림체 둘러보기</a><a href="#motion">움직임 보기</a></nav>
    </div>
    <img src="Sprites/06-clean-cel.png" alt="">
  </div>
</header>
<main class="wrap">
  <section id="styles" aria-labelledby="styles-heading">
    <h2 id="styles-heading">그림체</h2>
    <div class="controls">
      <label class="control" for="group">그림체 계열<select id="group"><option value="">전체</option></select></label>
      <label class="control" for="background">미리보기 배경<select id="background">
        <option value="light">밝은 배경</option><option value="dark">어두운 배경</option><option value="grid">투명 격자</option>
      </select></label>
      <label class="control" for="size">미리보기 높이<span class="range-value"><input id="size" type="range" min="48" max="224" step="8" value="208"><output id="size-value" for="size">208 px</output></span></label>
      <button id="compare" type="button" aria-pressed="false" disabled>고른 시안만 보기</button>
    </div>
    <p id="count" class="count" aria-live="polite"></p>
    <div class="grid" id="cards"></div>
  </section>
  <section id="motion" aria-labelledby="motion-heading">
    <h2 id="motion-heading">움직임</h2>
    <p class="intro">캐릭터의 발을 같은 높이에 맞춘 2D 프레임입니다. 별꽃 마법은 준비, 시전, 복귀 순서로 움직입니다.</p>
    <div class="movie-controls" role="group" aria-label="모션 재생">
      <button type="button" data-action="walk" aria-pressed="true">걷기</button>
      <button type="button" data-action="cast" aria-pressed="false">별꽃 마법</button>
      <button type="button" id="play" aria-pressed="false">재생</button>
      <label for="frame">프레임</label><input type="range" id="frame" min="1" max="6" value="1"><output id="frame-value" for="frame">1 / 6</output>
    </div>
    <div class="motion-grid" id="motion-cards"></div>
  </section>
  <nav class="links" aria-label="제작 파일">
    <a href="../Texturing/Reference/Iris_Concept_UserReference.png">이리스 원화</a><a href="sprite-manifest.json">PNG·모션 좌표</a><a href="imagegen-prompts.txt">생성 프롬프트</a>
  </nav>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="dialog-copy"><div><h2 id="detail-title"></h2><p id="detail-meta"></p></div><form method="dialog"><button type="submit">닫기</button></form></div>
  <div class="dialog-art"><img id="detail-art" alt=""></div>
  <div class="dialog-copy"><a id="detail-download" class="download" download>투명 PNG 내려받기</a></div>
</dialog>

<script>
const packageData=JSON.parse(document.getElementById('package').textContent);
const get=id=>document.getElementById(id);
const make=(tag,attributes={},text='')=>{
  const element=document.createElement(tag);
  for(const [key,value] of Object.entries(attributes))element.setAttribute(key,value);
  element.textContent=text;
  return element;
};
const group=get('group');
const compare=get('compare');
const selected=new Set();
const cards=[];
const detail=get('detail');
for(const name of new Set(packageData.sprites.map(sprite=>sprite.group)))group.append(make('option',{value:name},name));
for(const sprite of packageData.sprites){
  const card=make('article',{class:'card'});
  const image=make('img',{src:sprite.file,loading:'lazy',decoding:'async',alt:'',class:sprite.group==='픽셀'?'pixel':''});
  const art=make('button',{class:'art',type:'button','aria-label':sprite.title+' 확대'});
  art.append(image);
  art.addEventListener('click',()=>{
    get('detail-title').textContent=sprite.title;
    get('detail-meta').textContent=sprite.group+' · '+sprite.width+' × '+sprite.height+' px';
    const full=get('detail-art');
    full.src=sprite.file;full.alt=sprite.title+' 이리스';full.className=image.className;
    get('detail-download').href=sprite.file;
    detail.showModal();
  });
  const pick=make('button',{type:'button','aria-pressed':'false','aria-label':sprite.title+' 비교에 추가'},'비교');
  pick.addEventListener('click',()=>{
    if(selected.has(sprite.id))selected.delete(sprite.id);else selected.add(sprite.id);
    pick.setAttribute('aria-pressed',String(selected.has(sprite.id)));
    pick.textContent=selected.has(sprite.id)?'선택됨':'비교';
    applyFilters();
  });
  const copy=make('div',{class:'card-copy'});
  copy.append(make('h3',{},sprite.title),make('p',{},sprite.group+' · '+sprite.width+' × '+sprite.height+' px'));
  const actions=make('div',{class:'card-actions'});
  actions.append(pick,make('a',{href:sprite.file,class:'download',download:''},'PNG'));
  copy.append(actions);card.append(art,copy);get('cards').append(card);cards.push({card,sprite});
}
function applyFilters(){
  if(!selected.size)compare.setAttribute('aria-pressed','false');
  compare.disabled=!selected.size;
  const onlySelected=compare.getAttribute('aria-pressed')==='true';
  group.disabled=onlySelected;
  let shown=0;
  for(const {card,sprite} of cards){
    const visible=onlySelected?selected.has(sprite.id):!group.value||sprite.group===group.value;
    card.hidden=!visible;
    if(visible)shown++;
  }
  compare.textContent=onlySelected?'모든 시안 보기':'고른 시안만 보기'+(selected.size?' ('+selected.size+')':'');
  get('count').textContent=shown+'종 표시';
}
compare.addEventListener('click',()=>{
  compare.setAttribute('aria-pressed',String(compare.getAttribute('aria-pressed')!=='true'));
  applyFilters();
});
group.addEventListener('change',applyFilters);
get('background').addEventListener('change',event=>document.body.dataset.background=event.target.value);
get('size').addEventListener('input',event=>{
  document.documentElement.style.setProperty('--size',event.target.value+'px');
  get('size-value').value=event.target.value+' px';
});
applyFilters();

const samples=[];
const frameInput=get('frame');
const play=get('play');
let action='walk',frameIndex=0,playing=false,elapsed=0,priorTime=0,animationRequest;
for(const sample of packageData.motion){
  const card=make('article',{class:'motion-card'});
  const heading=make('header');
  heading.append(make('h3',{},sample.title));
  const canvas=make('canvas',{width:420,height:300,'aria-label':sample.title+' 캐릭터 애니메이션'});
  const art=make('div',{class:'motion-art'});
  art.append(canvas);
  const file=make('a',{class:'download',download:''},'스프라이트 시트 PNG');
  const info=make('span');
  const footer=make('footer');
  footer.append(file,info);card.append(heading,art,footer);get('motion-cards').append(card);
  samples.push({sample,canvas,context:canvas.getContext('2d'),file,info,atlases:{}});
}
const controlButtons=[...document.querySelectorAll('[data-action]')];
function changeAction(name){
  action=name;frameIndex=0;elapsed=0;
  for(const button of controlButtons)button.setAttribute('aria-pressed',String(button.dataset.action===action));
  for(const panel of samples){
    const clip=panel.sample.clips[action];
    panel.file.href=clip.file;
    panel.info.textContent=clip.durationsMs.length+'프레임 · '+clip.frameWidth+' × '+clip.frameHeight+' px / 칸';
    if(!panel.atlases[action]){
      const image=new Image();
      image.addEventListener('load',draw);
      image.src=clip.file;
      panel.atlases[action]=image;
    }
  }
  frameInput.max=samples[0].sample.clips[action].durationsMs.length;
  draw();
}
function draw(){
  for(const {sample,context,canvas,atlases} of samples){
    context.clearRect(0,0,canvas.width,canvas.height);
    const image=atlases[action];
    if(!image?.naturalWidth)continue;
    const clip=sample.clips[action];
    const count=clip.durationsMs.length;
    const cell=frameIndex%count;
    const sx=(cell%clip.columns)*clip.frameWidth;
    const sy=Math.floor(cell/clip.columns)*clip.frameHeight;
    const scale=Math.min(226/clip.referenceHeight,canvas.width*.94/clip.frameWidth,261/clip.pivotPx[1]);
    context.imageSmoothingEnabled=sample.group!=='픽셀';
    context.drawImage(image,sx,sy,clip.frameWidth,clip.frameHeight,canvas.width/2-clip.pivotPx[0]*scale,
                      canvas.height-22-clip.pivotPx[1]*scale,clip.frameWidth*scale,clip.frameHeight*scale);
  }
  frameInput.value=frameIndex+1;
  const stage=samples[0].sample.clips[action].stages?.[frameIndex];
  get('frame-value').value=(frameIndex+1)+' / '+frameInput.max+(stage?' · '+stage:'');
}
function tick(time){
  if(!playing)return;
  const clip=samples[0].sample.clips[action];
  const durations=clip.durationsMs;
  elapsed+=Math.min(priorTime?time-priorTime:0,90);priorTime=time;
  while(elapsed>=durations[frameIndex]){
    if(!clip.loop&&frameIndex===durations.length-1){setPlaying(false);return;}
    elapsed-=durations[frameIndex];frameIndex=(frameIndex+1)%durations.length;draw();
  }
  animationRequest=requestAnimationFrame(tick);
}
function setPlaying(active){
  playing=active;priorTime=0;
  play.textContent=active?'일시정지':'재생';play.setAttribute('aria-pressed',String(active));
  if(active)animationRequest=requestAnimationFrame(tick);else cancelAnimationFrame(animationRequest);
}
for(const button of controlButtons)button.addEventListener('click',()=>changeAction(button.dataset.action));
play.addEventListener('click',()=>{
  const clip=samples[0].sample.clips[action];
  if(!playing&&!clip.loop&&frameIndex===clip.durationsMs.length-1){frameIndex=0;elapsed=0;draw();}
  setPlaying(!playing);
});
frameInput.addEventListener('input',()=>{setPlaying(false);frameIndex=Number(frameInput.value)-1;elapsed=0;draw();});
if(samples.length)changeAction(action);else get('motion').hidden=true;
</script>
