<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>이리스 8방향 달리기</title>
  <style>
    html {
      color-scheme: light dark;
      background: var(--background,#f8fafd);
      color: var(--foreground,#192645);
    }
    body {
      margin: 0;
      font-family: var(--font-sans,system-ui,sans-serif);
    }
    main {
      width: min(900px,100%);
      padding: 12px clamp(9px,3vw,24px) 18px;
      margin: auto;
      box-sizing: border-box;
    }
    h1 { margin: 3px 0 10px; font-size: clamp(20px,3.6vw,29px); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 7px;
      margin-bottom: 12px;
    }
    label { display: grid; gap: 3px; font-size: 12px; }
    select,button,a.sheet {
      box-sizing: border-box;
      min-height: 36px;
      padding: 7px 9px;
      border: 1px solid var(--border,#cdd9e9);
      border-radius: var(--radius,8px);
      background: var(--card,#fff);
      color: var(--card-foreground,#203759);
      font: inherit;
      font-size: 14px;
      text-decoration: none;
    }
    button,a.sheet { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--ring,#3d6298); outline-offset: 2px; }
    #status { margin: 0 2px 8px; font-size: 12px; min-height: 1.25em; color: var(--muted-foreground,#4a6079); }
    .views {
      display: grid;
      grid-template-columns: repeat(4,minmax(0,1fr));
      gap: 8px;
    }
    .views.focused {
      max-width: 320px;
      margin: auto;
      grid-template-columns: minmax(0,1fr);
    }
    .views.pairs {
      max-width: 560px;
      margin: auto;
      grid-template-columns: repeat(2,minmax(0,1fr));
    }
    figure {
      margin: 0;
      min-width: 0;
      border: 1px solid var(--border,#cdd9e9);
      border-radius: var(--radius,10px);
      background: var(--muted,#edf2f9);
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: auto;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
    figcaption { padding: 3px 4px 9px; text-align: center; font-size: 13px; font-weight: 640; }
    [hidden] { display: none !important; }
    @media(max-width: 550px) {
      .views { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <h1>이리스 8방향 달리기</h1>
    <div class="controls">
      <label id="clip-field">그림체<select id="clip"></select></label>
      <label>방향<select id="direction"></select></label>
      <label>속도<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
      <button id="toggle" type="button" disabled>일시 정지</button>
      <button id="step" type="button" disabled>한 프레임</button>
      <a id="sheet" class="sheet" download hidden>시트 PNG</a>
    </div>
    <p id="status">이미지 불러오는 중</p>
    <div class="views" id="views"></div>
  </main>
  <script type="application/json" id="data">
{
  "directions": [
    {
      "id": "s",
      "label": "정면",
      "arrow": "↓",
      "yawDegrees": 0,
      "row": 0
    },
    {
      "id": "se",
      "label": "오른쪽 앞",
      "arrow": "↘",
      "yawDegrees": 45,
      "row": 1
    },
    {
      "id": "e",
      "label": "오른쪽 옆",
      "arrow": "→",
      "yawDegrees": 90,
      "row": 2
    },
    {
      "id": "ne",
      "label": "오른쪽 뒤",
      "arrow": "↗",
      "yawDegrees": 135,
      "row": 3
    },
    {
      "id": "n",
      "label": "뒷모습",
      "arrow": "↑",
      "yawDegrees": 180,
      "row": 4
    },
    {
      "id": "nw",
      "label": "왼쪽 뒤",
      "arrow": "↖",
      "yawDegrees": 225,
      "row": 5
    },
    {
      "id": "w",
      "label": "왼쪽 옆",
      "arrow": "←",
      "yawDegrees": 270,
      "row": 6
    },
    {
      "id": "sw",
      "label": "왼쪽 앞",
      "arrow": "↙",
      "yawDegrees": 315,
      "row": 7
    }
  ],
  "defaultFacing": "all",
  "clips": [
    {
      "id": "dither",
      "label": "8번 디더링 도트",
      "frameSizePx": [
        128,
        160
      ],
      "file": "Iris_Run_08_Dither_8Dir.png",
      "durationMs": 633.3333333333334,
      "frameDurationMs": 79.16666666666667
    },
    {
      "id": "facets",
      "label": "9번 다면 도트",
      "frameSizePx": [
        128,
        160
      ],
      "file": "Iris_Run_09_Faceted_8Dir.png",
      "durationMs": 633.3333333333334,
      "frameDurationMs": 79.16666666666667
    },
    {
      "id": "round-chibi",
      "label": "10번 둥근 치비 도트",
      "frameSizePx": [
        96,
        120
      ],
      "file": "Iris_Run_10_RoundChibi_8Dir.png",
      "durationMs": 633.3333333333334,
      "frameDurationMs": 79.16666666666667
    }
  ]
}
  </script>
  <script>
    const data = JSON.parse(document.querySelector('#data').textContent);
    const clipMenu = document.querySelector('#clip');
    const direction = document.querySelector('#direction');
    const speed = document.querySelector('#speed');
    const pause = document.querySelector('#toggle');
    const step = document.querySelector('#step');
    const download = document.querySelector('#sheet');
    const grid = document.querySelector('#views');
    const status = document.querySelector('#status');
    const pictures = new Map();
    const columns = 8;

    for (const clip of data.clips) clipMenu.add(new Option(clip.label, clip.id));
    document.querySelector('#clip-field').hidden = data.clips.length === 1;
    direction.add(new Option('8방향 전체', 'all'));
    for (const entry of data.directions) direction.add(new Option(entry.arrow + ' ' + entry.label, entry.id));
    direction.add(new Option('좌우 비교', 'pair'));
    direction.value = data.defaultFacing;
    const query = new URLSearchParams(location.search);
    if ([...clipMenu.options].some(option => option.value === query.get('clip'))) clipMenu.value = query.get('clip');
    if ([...direction.options].some(option => option.value === query.get('facing'))) direction.value = query.get('facing');

    let clip = data.clips.find(clip => clip.id === clipMenu.value);
    let phase = 0;
    let lastTime = null;
    let lastDrawn = -1;
    let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    let panels = [];

    function refreshGrid() {
      const [width, height] = clip.frameSizePx;
      const facing = direction.value;
      const indexes = facing === 'all'
        ? [0, 1, 2, 3, 4, 5, 6, 7]
        : facing === 'pair' ? [1, 7, 2, 6, 3, 5] : [data.directions.findIndex(entry => entry.id === facing)];
      grid.classList.toggle('focused', indexes.length === 1);
      grid.classList.toggle('pairs', facing === 'pair');
      grid.replaceChildren();
      panels = indexes.map((index, panel) => {
        const heading = data.directions[index];
        const reflection = facing === 'pair' && panel % 2 === 1;
        const title = heading.arrow + ' ' + heading.label + (reflection ? ' · 반전' : '');
        const card = document.createElement('figure');
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', '이리스 ' + clip.label + ' ' + title);
        const label = document.createElement('figcaption');
        label.textContent = title;
        card.dataset.facing = heading.id;
        card.append(canvas, label);
        grid.append(card);
        return { context: canvas.getContext('2d'), index, reflection };
      });
      download.hidden = !clip.file;
      if (clip.file) download.href = clip.file;
      lastDrawn = -1;
      paint();
    }

    function paint() {
      const picture = pictures.get(clip.id);
      const [width, height] = clip.frameSizePx;
      if (!picture) return;
      const animationPhase = Math.floor(phase / clip.frameDurationMs) % columns;
      if (animationPhase === lastDrawn) return;
      lastDrawn = animationPhase;
      const sourceWidth = picture.naturalWidth / columns;
      const sourceHeight = picture.naturalHeight / data.directions.length;
      for (const panel of panels) {
        const ctx = panel.context;
        const tile = (animationPhase + (panel.reflection ? 4 : 0)) % columns;
        ctx.clearRect(0, 0, width, height);
        ctx.imageSmoothingEnabled = false;
        ctx.save();
        if (panel.reflection) {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(picture, sourceWidth * tile, sourceHeight * panel.index, sourceWidth, sourceHeight, 0, 0, width, height);
        ctx.restore();
      }
      status.textContent = '프레임 ' + (animationPhase + 1) + ' / ' + columns;
      status.dataset.phase = animationPhase;
    }

    function animate(now) {
      if (lastTime !== null && playing) {
        const delta = Math.min(now - lastTime, 100) * Number(speed.value);
        phase = (phase + delta) % clip.durationMs;
      }
      lastTime = now;
      paint();
      requestAnimationFrame(animate);
    }

    function setPlaying(value) {
      playing = value;
      pause.textContent = playing ? '일시 정지' : '재생';
    }

    pause.addEventListener('click', () => setPlaying(!playing));
    step.addEventListener('click', () => {
      setPlaying(false);
      phase = ((lastDrawn + 1) % columns) * clip.frameDurationMs + .001;
      paint();
    });
    clipMenu.addEventListener('change', () => {
      const fraction = phase / clip.durationMs;
      clip = data.clips.find(item => item.id === clipMenu.value);
      phase = fraction * clip.durationMs;
      refreshGrid();
    });
    direction.addEventListener('change', refreshGrid);
    document.addEventListener('visibilitychange', () => { lastTime = null; });

    async function start() {
      try {
        await Promise.all(data.clips.map(async item => {
          const picture = new Image();
          picture.src = item.data || item.file;
          await picture.decode();
          pictures.set(item.id, picture);
        }));
        pause.disabled = step.disabled = false;
        setPlaying(playing);
        refreshGrid();
        document.body.dataset.ready = 'true';
        requestAnimationFrame(animate);
      } catch {
        status.textContent = '스프라이트 시트를 불러오지 못했습니다.';
      }
    }
    start();
  </script>
</body>
</html>
