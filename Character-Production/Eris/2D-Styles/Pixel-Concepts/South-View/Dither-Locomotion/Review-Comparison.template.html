<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이리스 모션 전후 비교</title>
<style>
* { box-sizing: border-box }
body {
  margin: 0;
  padding: 12px;
  color: var(--foreground,#f2edf4);
  background: var(--background,#181719);
  font: 14px var(--font-sans,system-ui,sans-serif);
}
main { max-width: 860px; margin: 0 auto }
h1 { margin: 0 0 12px; font-size: 19px; letter-spacing: -.025em }
[hidden] { display: none !important }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.panel {
  min-width: 0;
  border: 1px solid var(--border,#3d3742);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card,#201e23);
  color: var(--card-foreground,#f2edf4);
}
.panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  min-height: 45px;
  padding: 6px 9px;
}
.panel strong { font-size: 13px }
small { color: var(--muted-foreground,#bfb3c3) }
#position { font-variant-numeric: tabular-nums; white-space: nowrap }
.stage { display: grid; place-items: center; height: 210px; overflow: hidden; background: #342e3b }
canvas { display: block; image-rendering: pixelated }
.stage canvas { width: auto; height: 200px; max-width: 100%; object-fit: contain }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 }
button, select {
  min-height: 33px;
  padding: 4px 8px;
  border: 1px solid var(--border,#3d3742);
  border-radius: 7px;
  color: var(--foreground,#f2edf4);
  background: var(--card,#201e23);
  font: inherit;
  cursor: pointer;
}
button:hover, select:hover, button[aria-current="true"] {
  background: var(--accent,#393242);
  color: var(--accent-foreground,#fff4ff);
}
button:focus-visible, select:focus-visible {
  outline: 2px solid var(--ring,#bda1e1);
  outline-offset: 1px;
}
button[aria-current="true"] { border-color: var(--ring,#bda1e1); font-weight: 700 }
#play { min-width: 76px }
.timeline { display: grid; grid-template-columns: repeat(var(--columns,8), minmax(0,1fr)); gap: 5px }
.timeline button { padding: 4px; min-width: 0; font-size: 12px }
.timeline canvas {
  width: 100%;
  height: auto;
  max-height: 94px;
  object-fit: contain;
  background: #342e3b;
  border-radius: 4px;
}
.timeline span { display: block; margin: 3px 0 1px }
#overlay-note { margin: 8px 0 0; font-size: 12px; color: var(--muted-foreground,#bfb3c3) }
@media(max-width: 500px) {
  body { padding: 9px }
  .panels { gap: 7px }
  .stage { height: 172px }
  .stage canvas { height: 164px }
  .timeline { grid-template-columns: repeat(4,minmax(0,1fr)) }
  .timeline canvas { height: 57px }
}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="panels">
    <section class="panel">
      <header><strong>수정 후</strong><small id="position"></small></header>
      <div class="stage"><canvas id="candidate" role="img" aria-label="수정 후 프레임"></canvas></div>
    </section>
    <section class="panel">
      <header>
        <select id="compare-mode" aria-label="오른쪽 비교 화면">
          <option value="before">수정 전</option>
          <option value="overlay">외곽 겹치기</option>
        </select>
      </header>
      <div class="stage"><canvas id="reference" role="img" aria-label="수정 전 프레임"></canvas></div>
    </section>
  </div>
  <div class="controls">
    <button id="prev" type="button" aria-label="이전 프레임">이전</button>
    <button id="play" type="button" aria-pressed="false">재생</button>
    <button id="next" type="button" aria-label="다음 프레임">다음</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
    </select>
    <small id="contact" hidden></small>
  </div>
  <div class="timeline" id="frames" aria-label="프레임 선택"></div>
  <p id="overlay-note" hidden>하늘색 선은 수정 전 프레임의 외곽입니다.</p>
  <p id="error" role="alert" hidden>비교 이미지를 읽을 수 없습니다.</p>
</main>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
(async () => {
  const get = id => document.getElementById(id);
  const data = JSON.parse(get('review-data').textContent);
  const { width, height, frameCount, frameDurationMs } = data;
  const position = get('position');
  const playButton = get('play');
  const speed = get('speed');
  const mode = get('compare-mode');
  let index = 0;
  let request = 0;
  let elapsed = 0;
  let lastTime = null;
  let playing = false;
  function contactLabel(code) {
    if (!code) return '';
    if (code === 'air') return '공중';
    if (code === 'dual') return '양발 지지';
    const [side, phase] = code.split('-');
    const action = { heel: '착지', flat: '지지', toe: '밀기' };
    return (side === 'left' ? '왼발 ' : '오른발 ') + (action[phase] || '지지');
  }

  function prepare(canvas) {
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d');
    context.imageSmoothingEnabled = false;
    return context;
  }

  function draw(context, strip, frame) {
    context.drawImage(strip, frame * width, 0, width, height, 0, 0, width, height);
  }

  async function load(uri) {
    const img = new Image();
    img.src = uri;
    await img.decode();
    return img;
  }

  function makeOutline(strip) {
    const canvas = document.createElement('canvas');
    canvas.width = strip.naturalWidth;
    canvas.height = strip.naturalHeight;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(strip, 0, 0);
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
    const outline = context.createImageData(canvas.width, canvas.height);
    const stride = canvas.width * 4;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const at = y * stride + x * 4;
        if (!pixels.data[at + 3]) continue;
        const column = x % width;
        if (column === 0 || column === width - 1 || y === 0 || y === height - 1 ||
            !pixels.data[at - 1] || !pixels.data[at + 7] ||
            !pixels.data[at + 3 - stride] || !pixels.data[at + 3 + stride]) {
          outline.data.set([113, 212, 249, 200], at);
        }
      }
    }
    context.putImageData(outline, 0, 0);
    return canvas;
  }

  try {
    const [candidate, before] = await Promise.all([load(data.candidate), load(data.before)]);
    for (const strip of [candidate, before]) {
      if (strip.naturalWidth !== width * frameCount || strip.naturalHeight !== height) {
        throw new Error('Unexpected frame strip dimensions.');
      }
    }
    const left = prepare(get('candidate'));
    const right = prepare(get('reference'));
    let outline;
    const thumbnails = [];

    function render() {
      left.clearRect(0, 0, width, height);
      right.clearRect(0, 0, width, height);
      draw(left, candidate, index);
      const overlay = mode.value === 'overlay';
      if (overlay) {
        outline ??= makeOutline(before);
        draw(right, candidate, index);
        draw(right, outline, index);
      } else {
        draw(right, before, index);
      }
      right.canvas.setAttribute('aria-label', overlay ? '수정 전 외곽을 겹친 프레임' : '수정 전 프레임');
      get('overlay-note').hidden = !overlay;
      position.textContent = (index + 1) + ' / ' + frameCount;
      const contact = get('contact');
      contact.textContent = contactLabel(data.contact[index]);
      contact.hidden = !contact.textContent;
      thumbnails.forEach((button, frame) => {
        if (frame === index) button.setAttribute('aria-current', 'true');
        else button.removeAttribute('aria-current');
      });
      document.body.dataset.frame = index + 1;
    }

    function tick(now) {
      if (lastTime !== null) {
        const delta = (now - lastTime) * Number(speed.value);
        elapsed = delta >= frameDurationMs ? frameDurationMs : elapsed + delta;
      }
      lastTime = now;
      if (elapsed >= frameDurationMs) {
        elapsed -= frameDurationMs;
        index = (index + 1) % frameCount;
        render();
      }
      request = requestAnimationFrame(tick);
    }

    function play(active) {
      cancelAnimationFrame(request);
      lastTime = null;
      playing = active;
      playButton.textContent = active ? '일시정지' : '재생';
      playButton.setAttribute('aria-pressed', String(active));
      if (active) request = requestAnimationFrame(tick);
    }

    function selectFrame(frame) {
      play(false);
      elapsed = 0;
      index = (frame + frameCount) % frameCount;
      render();
    }

    const title = data.title.replace(' 옆 ', ' ');
    document.title = title;
    get('title').textContent = title;
    get('frames').style.setProperty('--columns', Math.min(frameCount, 8));

    for (let frame = 0; frame < frameCount; frame++) {
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('aria-label', (frame + 1) + '번 프레임');
      const canvas = document.createElement('canvas');
      draw(prepare(canvas), candidate, frame);
      const label = document.createElement('span');
      label.textContent = frame + 1;
      button.append(canvas, label);
      button.addEventListener('click', () => selectFrame(frame));
      get('frames').append(button);
      thumbnails.push(button);
    }

    get('prev').addEventListener('click', () => selectFrame(index - 1));
    get('next').addEventListener('click', () => selectFrame(index + 1));
    playButton.addEventListener('click', () => play(!playing));
    mode.addEventListener('change', render);
    document.addEventListener('visibilitychange', () => { lastTime = null; });
    document.addEventListener('keydown', event => {
      if (event.target instanceof HTMLSelectElement) return;
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      selectFrame(index + (event.key === 'ArrowLeft' ? -1 : 1));
    });

    render();
    play(!matchMedia('(prefers-reduced-motion: reduce)').matches);
    document.body.dataset.ready = 'true';
  } catch (error) {
    get('error').hidden = false;
    console.error(error);
  }
})();
</script>
</body>
</html>
