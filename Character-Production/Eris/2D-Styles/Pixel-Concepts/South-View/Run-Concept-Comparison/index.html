<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이리스 달리기 · 3가지 컨셉</title>
<style>
* { box-sizing: border-box }
body {
  margin: 0;
  padding: 12px;
  color: var(--foreground,#f2edf4);
  background: var(--background,#181719);
  font: 14px var(--font-sans,system-ui,sans-serif);
}
main { max-width: 860px; margin: 0 auto }
h1 { margin: 0 0 12px; font-size: 19px; letter-spacing: -.025em }
[hidden] { display: none !important }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.panel {
  min-width: 0;
  border: 1px solid var(--border,#3d3742);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card,#201e23);
  color: var(--card-foreground,#f2edf4);
}
.panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  min-height: 45px;
  padding: 6px 9px;
}
.panel strong { font-size: 13px }
small { color: var(--muted-foreground,#bfb3c3) }
#position { font-variant-numeric: tabular-nums; white-space: nowrap }
.stage { display: grid; place-items: center; height: 210px; overflow: hidden; background: #342e3b }
canvas { display: block; image-rendering: pixelated }
.stage canvas { width: auto; height: 200px; max-width: 100%; object-fit: contain }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 }
button, select {
  min-height: 33px;
  padding: 4px 8px;
  border: 1px solid var(--border,#3d3742);
  border-radius: 7px;
  color: var(--foreground,#f2edf4);
  background: var(--card,#201e23);
  font: inherit;
  cursor: pointer;
}
button:hover, select:hover, button[aria-current="true"] {
  background: var(--accent,#393242);
  color: var(--accent-foreground,#fff4ff);
}
button:focus-visible, select:focus-visible {
  outline: 2px solid var(--ring,#bda1e1);
  outline-offset: 1px;
}
button[aria-current="true"] { border-color: var(--ring,#bda1e1); font-weight: 700 }
#play { min-width: 76px }
.timeline { display: grid; grid-template-columns: repeat(var(--columns,8), minmax(0,1fr)); gap: 5px }
.timeline button { padding: 4px; min-width: 0; font-size: 12px }
.timeline canvas {
  width: 100%;
  height: auto;
  max-height: 94px;
  object-fit: contain;
  background: #342e3b;
  border-radius: 4px;
}
.timeline span { display: block; margin: 3px 0 1px }
#overlay-note { margin: 8px 0 0; font-size: 12px; color: var(--muted-foreground,#bfb3c3) }
@media(max-width: 500px) {
  body { padding: 9px }
  .panels { gap: 7px }
  .stage { height: 172px }
  .stage canvas { height: 164px }
  .timeline { grid-template-columns: repeat(4,minmax(0,1fr)) }
  .timeline canvas { height: 57px }
}

  .panel select { width:100%; min-width:0; }
  #position { min-width:38px }
  select,button { min-height:36px }
</style>
</head>
<body>
<main>
  <h1>이리스 달리기 · 3가지 컨셉</h1>
  <div class="panels">
    <section class="panel">
      <header><select id="left-style" aria-label="왼쪽 컨셉"></select></header>
      <div class="stage"><canvas id="left" role="img" aria-label="왼쪽 프레임"></canvas></div>
    </section>
    <section class="panel">
      <header><select id="right-style" aria-label="오른쪽 컨셉"></select></header>
      <div class="stage"><canvas id="right" role="img" aria-label="오른쪽 프레임"></canvas></div>
    </section>
  </div>
  <div class="controls">
    <button id="prev" type="button" aria-label="이전 프레임">이전</button>
    <button id="play" type="button" aria-pressed="false">재생</button>
    <button id="next" type="button" aria-label="다음 프레임">다음</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
    </select>
    <select id="zoom" aria-label="확대할 부분">
      <option value="all">전체</option>
      <option value="face">얼굴</option>
      <option value="hands">손목·소매</option>
      <option value="feet">발목·부츠</option>
    </select>
    <small id="position"></small>
    <small id="support"></small>
  </div>
  <div class="timeline" id="frames" aria-label="프레임 선택"></div>
  <p id="error" role="alert" hidden>스프라이트를 불러오지 못했습니다.</p>
</main>
<script>
(async () => {
  const get = id => document.getElementById(id);
  const art = [
    '08 디더링 도트',
    '09 다면 컬러 블록',
    '10 둥근 치비'
  ];
  const foot = ['왼발 착지','왼발 지지','왼발 밀기','공중','오른발 착지','오른발 지지','오른발 밀기','공중'];
  const full = { x:20, y:39, width:88, height:102 };
  const regions = {
    all:full,
    face:{ x:49, y:43, width:47, height:48 },
    hands:{ x:45, y:75, width:49, height:42 },
    feet:{ x:28, y:98, width:65, height:42 }
  };
  const interval = 90, count = 8;
  const left = get('left-style'), right = get('right-style'), playButton = get('play');
  const sprite = new Image();
  sprite.src = 'Iris_Run_Concepts.png';
  try {
    await sprite.decode();
    if (sprite.naturalWidth!==1024 || sprite.naturalHeight!==480) throw new Error('Invalid cel grid');
  } catch {
    get('error').hidden=false;
    return;
  }
  const frames = [];
  let index=3, playing=false, request=0, lastTime=null, progress=0;

  for (const select of [left,right]) {
    art.forEach((name,row) => select.add(new Option(name,String(row))));
    select.addEventListener('change',() => {
      makeThumbnails();
      render();
    });
  }
  left.value='1';
  right.value='0';
  for (let frame=0;frame<count;frame++) {
    const button = document.createElement('button');
    const canvas = document.createElement('canvas');
    const label = document.createElement('span');
    button.type='button';
    button.setAttribute('aria-label',(frame+1)+'번 프레임');
    label.textContent=frame+1;
    button.append(canvas,label);
    button.addEventListener('click',() => selectFrame(frame));
    get('frames').append(button);
    frames.push({button,canvas});
  }

  function paint(canvas,row,frame,crop) {
    if (canvas.width!==crop.width || canvas.height!==crop.height) {
      canvas.width=crop.width;
      canvas.height=crop.height;
    }
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled=false;
    ctx.clearRect(0,0,crop.width,crop.height);
    ctx.drawImage(sprite,frame*128+crop.x,row*160+crop.y,crop.width,crop.height,0,0,crop.width,crop.height);
  }

  function makeThumbnails() {
    frames.forEach(({ canvas },i) => paint(canvas,Number(left.value),i,full));
  }

  function render() {
    const region=regions[get('zoom').value];
    paint(get('left'),Number(left.value),index,region);
    paint(get('right'),Number(right.value),index,region);
    get('left').setAttribute('aria-label',art[Number(left.value)]+' '+(index+1)+'번');
    get('right').setAttribute('aria-label',art[Number(right.value)]+' '+(index+1)+'번');
    get('position').textContent=(index+1)+' / 8';
    get('support').textContent=foot[index];
    document.body.dataset.frame=String(index+1);
    frames.forEach(({button},i) => {
      if (i===index) button.setAttribute('aria-current','true');
      else button.removeAttribute('aria-current');
    });
  }

  function tick(now) {
    if (lastTime!==null) {
      const elapsed=(now-lastTime)*Number(get('speed').value);
      progress=elapsed>=interval?interval:progress+elapsed;
    }
    lastTime=now;
    if (progress>=interval) {
      progress-=interval;
      index=(index+1)%count;
      render();
    }
    request=requestAnimationFrame(tick);
  }

  function play(active) {
    cancelAnimationFrame(request);
    playing=active;
    lastTime=null;
    progress=0;
    playButton.textContent=active?'일시정지':'재생';
    playButton.setAttribute('aria-pressed',String(active));
    if (active) request=requestAnimationFrame(tick);
  }

  function selectFrame(frame) {
    play(false);
    index=(frame+count)%count;
    render();
  }

  get('prev').addEventListener('click',() => selectFrame(index-1));
  get('next').addEventListener('click',() => selectFrame(index+1));
  playButton.addEventListener('click',() => play(!playing));
  get('zoom').addEventListener('change',render);
  document.addEventListener('visibilitychange',() => { lastTime=null; });
  document.addEventListener('keydown',event => {
    if (event.target instanceof HTMLSelectElement || !['ArrowLeft','ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    selectFrame(index+(event.key==='ArrowLeft'?-1:1));
  });
  makeThumbnails();
  render();
  document.body.dataset.ready='true';
})();
</script>
</body>
</html>
